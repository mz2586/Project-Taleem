openapi: 3.1.0
info:
  title: Project Taleem — School Organizations, Teachers, Classes & Assignments API
  version: 0.1.0
  description: >-
    The pilot-minimum teacher and organization backend. Nothing in this API is, or is described as,
    an accredited programme.


    Properties this contract commits to:


    * **Tenant isolation.** An organization is a tenant. A teacher's organization comes from the
      teacher's own record (the token subject), never from a request. A class, assignment, or
      organization outside the teacher's scope is reported `404`, never `403`, so a probe cannot
      confirm that an id exists in another school.
    * **Guardian-approved enrolment.** A learner joins a class only when their guardian submits the
      class code (`POST /v1/school/classes:join`). That act records `progress_sharing` consent in the
      identity context — the scope defined for sharing progress with a mentor or teacher. Joining
      never restores a withdrawn learning consent: it is refused (`409 CONSENT_REQUIRED`).
    * **Live visibility.** A teacher sees an enrolled learner only while the guardian's consent covers
      `progress_sharing` and the learner may still learn (active account, current learning
      consent). It is checked on every request, with no cache: after a withdrawal the learner
      disappears from the next response.
    * **Deny by default.** `system` creates organizations and teacher accounts; `teacher` manages its
      own classes and assignments; `guardian` joins its own learner. Everything else is denied.
    * **Per-class control for guardians.** A guardian lists their own child's classes and can leave
      one (`…/classes/{classId}:leave`); that teacher stops seeing the child on the next request.
      `progress_sharing` remains the master switch for every class at once. Another family's child
      is a `404`.
    * Teacher sign-in failures return one identical `401` and are rate limited. Only on a request
      that already carries a valid teacher token is the account state named: `403 TEACHER_LOCKED`
      (too many failed sign-ins) or `403 TEACHER_INACTIVE` (suspended).
    * Teacher sessions: a 60-minute access token plus a rotating, device-bound refresh token from
      the identity context. Refresh at `POST /v1/identity/sessions:refresh` and end the session at
      `POST /v1/identity/sessions:signout` (identity.openapi.yaml) — the same routes guardians use.
      Every refresh re-checks the teacher account live; a locked or suspended teacher's refresh
      fails with the same uniform `401` as any other refresh failure.
  license:
    name: Proprietary — license undecided; see repository LICENSE
servers:
  - url: https://api.taleem.dev
    description: Reference environment (placeholder; concrete host per FOUNDER_DECISIONS FD-02)
tags:
  - name: school
    description: Organizations (tenants), teacher accounts, classes, enrolment, assignments.
paths:
  /v1/school/organizations:
    post:
      tags: [school]
      operationId: createOrganization
      summary: Create an organization (operator)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationIn" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/organizations/{organizationId}:
    get:
      tags: [school]
      operationId: getOrganization
      summary: Read an organization (operator, or a teacher of that organization)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/organizations/{organizationId}/teachers:
    post:
      tags: [school]
      operationId: createTeacher
      summary: Create a teacher account in an organization (operator)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherIn" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Teacher" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/teachers:signin:
    post:
      tags: [school]
      operationId: signInTeacher
      summary: Teacher sign-in (public, rate limited, uniform failure)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherCredentials" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  teacher: { $ref: "#/components/schemas/Teacher" }
                  session: { $ref: "#/components/schemas/Session" }
                  refresh_token:
                    type: string
                    description: >-
                      Rotating, single-use, device-bound. Exchange at /v1/identity/sessions:refresh
                      with the same deviceId used here.
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/me:
    get:
      tags: [school]
      operationId: getTeacherProfile
      summary: The signed-in teacher and their organization
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  teacher: { $ref: "#/components/schemas/Teacher" }
                  organization: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/classes:
    post:
      tags: [school]
      operationId: createClass
      summary: Create a class (teacher); returns its join code
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Classroom" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [school]
      operationId: listClasses
      summary: The teacher's own classes
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items: { $ref: "#/components/schemas/ClassroomListed" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/classes:join:
    post:
      tags: [school]
      operationId: joinClass
      summary: Guardian enrols their own learner with a class code (records progress_sharing consent)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinIn" }
      responses:
        "200":
          description: Joined (idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  class_id: { type: string }
                  class_name: { type: string }
                  joined: { type: boolean }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/children/{studentRef}/classes:
    get:
      tags: [school]
      operationId: listChildClasses
      summary: The classes the guardian's own child has joined
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: studentRef, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items: { $ref: "#/components/schemas/ChildClass" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/children/{studentRef}/classes/{classId}:leave:
    post:
      tags: [school]
      operationId: leaveClass
      summary: Remove the child from one class (audited); that teacher loses visibility at once
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: studentRef, in: path, required: true, schema: { type: string } }
        - { name: classId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Left
          content:
            application/json:
              schema:
                type: object
                properties:
                  class_id: { type: string }
                  left: { type: boolean }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/lessons:
    get:
      tags: [school]
      operationId: listPublishedLessons
      summary: Published lessons of the teacher's curriculum pack (objective code + title only)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lessons available to assign
          content:
            application/json:
              schema:
                type: object
                properties:
                  lessons:
                    type: array
                    items: { $ref: "#/components/schemas/PublishedLesson" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/classes/{classId}:
    get:
      tags: [school]
      operationId: getClass
      summary: A class and the learners currently sharing progress with its teacher
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Class detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/classes/{classId}/assignments:
    post:
      tags: [school]
      operationId: createAssignment
      summary: Assign a published lesson (by objective code) with a due date
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentIn" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [school]
      operationId: listAssignments
      summary: Assignments in one of the teacher's classes
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items: { $ref: "#/components/schemas/Assignment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/classes/{classId}/assignments/{assignmentId}/progress:
    get:
      tags: [school]
      operationId: getAssignmentProgress
      summary: Per-learner completion and mastery for an assignment (sharing learners only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: string } }
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentProgress" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/classes/{classId}/learners/{studentRef}:
    get:
      tags: [school]
      operationId: getClassLearner
      summary: One learner of the teacher's class with the explained recommendations
      description: >-
        Visible only while the learner's guardian shares progress (the same live check as every
        class read). A hidden, unknown, or not-enrolled learner is 404 — never a hint it exists.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: string } }
        - { name: studentRef, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Learner detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassLearnerDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/learners/{studentRef}/homework:
    get:
      tags: [school]
      operationId: getLearnerHomework
      summary: The learner's homework — assigned and self-paced written items
      description: >-
        HOMEWORK_AND_MARKING_CONTRACT §2 + §6. A `student` token for its own `studentRef` only.
        Behind the live learner consent gate: a withdrawn consent or suspended account is `403` on
        the next request. Entries (and their items) are tagged `source`: `assignment` (every
        assignment of the learner's classes, with `due_at`) or `self_paced` (every lesson the
        learner has studied — a live session or a synced offline attempt — that no class of
        theirs assigned; no class, no due date). When a lesson is both, the assignment wins. Every
        lesson is read through the reader-cohort filter. Items carry `marking` (`auto` = exact
        key, marked on submit; `self_check` = open answer, never scored), the latest submission
        state and `can_retry`. Never a rubric or an answer key; the author's sample answer /
        guidance only as `compare`, after an open answer was submitted. Online only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: studentRef, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Homework
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerHomework" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/learners/{studentRef}/homework/{assignmentId}/items/{itemRef}:submit:
    post:
      tags: [school]
      operationId: submitHomeworkItem
      summary: Submit (or resubmit) a written answer
      description: >-
        The text is trimmed, must not be empty and is capped at the item's `max_chars` (`422`).
        Resubmitting is allowed while the state is `submitted` or `returned`, or after an
        automatic `not_yet` (`can_retry`: a new attempt on the same row, with its own evidence);
        any other `marked` answer is final (`409 SUBMISSION_MARKED`). An item with an exact key is
        marked on submit (`state: marked`, `reviewed_by: auto`, one mastery evidence per attempt);
        an open answer stays `submitted` with `marking: self_check`. The item must be a written
        item of the assignment's lesson and the assignment one of the learner's classes (`404`).
        `403 SHARING_REQUIRED` when the guardian does not share progress with the teacher. Every
        text passes the disclosure screen (a match raises a system safeguarding concern; the
        response never changes). Audited with refs only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: studentRef, in: path, required: true, schema: { type: string } }
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
        - { name: itemRef, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitIn" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/learners/{studentRef}/homework/self-paced/{objectiveCode}/items/{itemRef}:submit:
    post:
      tags: [school]
      operationId: submitSelfPacedHomeworkItem
      summary: Submit (or resubmit) a written answer to a lesson the learner studied
      description: >-
        HOMEWORK_AND_MARKING_CONTRACT §6. No assignment, class or teacher: nobody else reads the
        answer, so `SHARING_REQUIRED` does not apply. A lesson the learner has not studied, or
        that is unpublished or outside the reader's cohort, is `404`; a lesson a class of theirs
        has assigned is `409 LESSON_ASSIGNED` (answer it in the assignment). Same text, marking,
        retry, disclosure-screen and audit rules as the assignment route.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: studentRef, in: path, required: true, schema: { type: string } }
        - { name: objectiveCode, in: path, required: true, schema: { type: string } }
        - { name: itemRef, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitIn" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/classes/{classId}/submissions:
    get:
      tags: [school]
      operationId: listClassSubmissions
      summary: The marking queue of the teacher's own class (oldest first)
      description: >-
        Only learners the teacher may see right now (enrolled, live progress sharing). Each row
        carries the item's marking aids for the teacher. Another school's class is `404`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: string } }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [submitted, returned, marked], default: submitted }
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  submissions:
                    type: array
                    items: { $ref: "#/components/schemas/TeacherSubmission" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/submissions/{submissionId}:mark:
    post:
      tags: [school]
      operationId: markSubmission
      summary: Mark a submission (final) and record one mastery evidence for it
      description: >-
        `score` is required when the item has a rubric and must be in `0..max_score`; without a
        rubric it must be null (`422`). A submission is marked once (`409 SUBMISSION_MARKED`).
        Records exactly one `AssessmentEvidence` (correct for `met`), idempotent by
        `submission_id`. Not the teacher's class, or a learner they cannot see: `404`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkIn" }
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherSubmission" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/submissions/{submissionId}:return:
    post:
      tags: [school]
      operationId: returnSubmission
      summary: Return a submission so the child can try again (feedback required)
      description: >-
        Only a `submitted` answer can be returned (`409 SUBMISSION_RETURNED` /
        `409 SUBMISSION_MARKED` otherwise). Records no evidence.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnIn" }
      responses:
        "200":
          description: Returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherSubmission" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/school/submissions/{submissionId}:concern:
    post:
      tags: [school]
      operationId: raiseSubmissionConcern
      summary: Raise a safeguarding concern about the learner of this submission
      description: >-
        HOMEWORK_AND_MARKING_CONTRACT §4. Creates a concern in the safeguarding queue with
        `source = teacher`, about the submission's learner and referencing the `submission_id` —
        both taken from the server, never the client. Allowed for a submission in the teacher's
        own class (`404` otherwise), even when progress sharing is off. Never changes the
        submission; the child is never told. Returns a receipt only. Rate limited per teacher.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionConcernIn" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConcernReceipt" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    LocalizedText:
      type: object
      description: Locale map (ur / en).
      additionalProperties: { type: string }
    LearnerSubmission:
      type: object
      description: The learner's own submission. Feedback appears once returned or marked.
      properties:
        submission_id: { type: string }
        state: { type: string, enum: [submitted, returned, marked] }
        text: { type: string }
        attempt: { type: integer, minimum: 1 }
        submitted_at: { type: number }
        feedback: { type: ["string", "null"] }
        returned_at: { type: ["number", "null"] }
        outcome: { type: ["string", "null"], enum: [met, not_yet, null] }
        score: { type: ["integer", "null"] }
        max_score: { type: ["integer", "null"] }
        marked_at: { type: ["number", "null"] }
        reviewed_by:
          type: ["string", "null"]
          enum: [auto, null]
          description: "`auto` for an automatic mark; null otherwise (a teacher is never named)."
        can_retry:
          type: boolean
          description: True after an automatic `not_yet` — the learner may try again.
    HomeworkSource:
      type: string
      enum: [assignment, self_paced]
    HomeworkMarking:
      type: string
      enum: [auto, self_check]
      description: >-
        `auto`: the author stated an exact answer; marked on submit with the fill `normalize`
        rule. `self_check`: an open answer; never scored by a rule or a model.
    CompareYourAnswer:
      type: object
      description: >-
        The author's sample answer and/or guidance for an open (`self_check`) item, shown only
        after the learner submitted, for "compare your answer". Never a score.
      properties:
        label: { type: string, enum: [compare_your_answer] }
        sample_answer: { type: ["string", "null"] }
        guidance: { type: ["string", "null"] }
    LearnerHomeworkItem:
      type: object
      description: >-
        A written item as the learner sees it. Never a rubric or an answer key; the sample answer
        or guidance only as `compare`, after submitting an open answer.
      properties:
        item_ref: { type: string }
        kind: { type: string, enum: [written] }
        prompt: { $ref: "#/components/schemas/LocalizedText" }
        hints: { type: array, items: { type: string } }
        max_chars: { type: integer, description: "200 for short, 2000 otherwise" }
        source: { $ref: "#/components/schemas/HomeworkSource" }
        marking: { $ref: "#/components/schemas/HomeworkMarking" }
        state: { type: string, enum: [not_started, submitted, returned, marked] }
        can_retry: { type: boolean }
        submission:
          oneOf:
            - { $ref: "#/components/schemas/LearnerSubmission" }
            - { type: "null" }
        compare:
          oneOf:
            - { $ref: "#/components/schemas/CompareYourAnswer" }
            - { type: "null" }
    LearnerHomework:
      type: object
      properties:
        assignments:
          type: array
          items:
            type: object
            description: An assignment, or (`source = self_paced`) a lesson the learner studied.
            properties:
              source: { $ref: "#/components/schemas/HomeworkSource" }
              assignment_id: { type: ["string", "null"] }
              class_id: { type: ["string", "null"] }
              class_name: { type: ["string", "null"] }
              objective_code: { type: string }
              lesson_title: { $ref: "#/components/schemas/LocalizedText" }
              due_at: { type: ["number", "null"], description: "null for self-paced" }
              overdue: { type: boolean }
              items:
                type: array
                items: { $ref: "#/components/schemas/LearnerHomeworkItem" }
    SubmitIn:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, description: "Trimmed; 1..max_chars characters." }
    SubmitResult:
      type: object
      properties:
        source: { $ref: "#/components/schemas/HomeworkSource" }
        assignment_id: { type: ["string", "null"] }
        objective_code: { type: string }
        item_ref: { type: string }
        marking: { $ref: "#/components/schemas/HomeworkMarking" }
        state: { type: string, enum: [submitted, marked] }
        can_retry: { type: boolean }
        submission: { $ref: "#/components/schemas/LearnerSubmission" }
        compare:
          oneOf:
            - { $ref: "#/components/schemas/CompareYourAnswer" }
            - { type: "null" }
    Rubric:
      type: object
      description: Teacher-only marking rubric.
      properties:
        criteria: { type: string }
        max_score: { type: integer, minimum: 0 }
        levels:
          type: array
          items:
            type: object
            properties:
              score: { type: integer }
              label: { type: string, description: The level number (no separate label is authored). }
              descriptor: { $ref: "#/components/schemas/LocalizedText" }
    TeacherSubmission:
      type: object
      description: One marking-queue row (teacher only).
      properties:
        submission_id: { type: string }
        student_ref: { type: string }
        learner_display_name: { type: string }
        class_id: { type: string }
        assignment_id: { type: string }
        objective_code: { type: string }
        lesson_title: { $ref: "#/components/schemas/LocalizedText" }
        item_ref: { type: string }
        prompt: { $ref: "#/components/schemas/LocalizedText" }
        max_chars: { type: ["integer", "null"] }
        rubric:
          oneOf:
            - { $ref: "#/components/schemas/Rubric" }
            - { type: "null" }
        sample_answer: { type: ["string", "null"] }
        guidance: { type: ["string", "null"] }
        text: { type: string }
        state: { type: string, enum: [submitted, returned, marked] }
        attempt: { type: integer }
        outcome: { type: ["string", "null"], enum: [met, not_yet, null] }
        score: { type: ["integer", "null"] }
        max_score: { type: ["integer", "null"] }
        feedback: { type: ["string", "null"] }
        submitted_at: { type: number }
        returned_at: { type: ["number", "null"] }
        marked_at: { type: ["number", "null"] }
        reviewed_by: { type: ["string", "null"] }
    MarkIn:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [met, not_yet] }
        score:
          type: ["integer", "null"]
          description: Required with a rubric (0..max_score); null without one.
        feedback: { type: string, maxLength: 1000 }
    ReturnIn:
      type: object
      required: [feedback]
      additionalProperties: false
      properties:
        feedback: { type: string, minLength: 1, maxLength: 1000 }
    SubmissionConcernIn:
      type: object
      required: [category]
      additionalProperties: false
      properties:
        category:
          type: string
          enum: [felt_unsafe, very_sad, bullying, upsetting_lesson, other]
        text: { type: ["string", "null"], maxLength: 500 }
    ConcernReceipt:
      type: object
      properties:
        received: { type: boolean }
        raised_at: { type: number }
        notice: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        traceId: { type: string }
    Session:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, const: "Bearer" }
        expires_at: { type: integer }
        expires_in: { type: integer }
        role: { type: string, const: "teacher" }
        subject: { type: string }
    OrganizationIn:
      type: object
      required: [name, country, curriculumPackId, defaultLocale]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        country: { type: string, description: ISO 3166-1 alpha-2, minLength: 2, maxLength: 2 }
        curriculumPackId: { type: string, maxLength: 64 }
        defaultLocale: { type: string, maxLength: 8 }
    Organization:
      type: object
      properties:
        organization_id: { type: string }
        name: { type: string }
        country: { type: string }
        curriculum_pack_id: { type: string }
        default_locale: { type: string }
        created_at: { type: number }
    TeacherIn:
      type: object
      required: [email, displayName, passphrase]
      properties:
        email: { type: string, maxLength: 254 }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        passphrase: { type: string, minLength: 10, maxLength: 256 }
    TeacherCredentials:
      type: object
      required: [email, passphrase]
      properties:
        email: { type: string }
        passphrase: { type: string }
        deviceId:
          type: string
          maxLength: 64
          description: Optional; binds the refresh chain to this device.
    Teacher:
      type: object
      properties:
        teacher_ref: { type: string }
        organization_id: { type: string }
        email: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [active, locked, suspended] }
        created_at: { type: number }
    Classroom:
      type: object
      properties:
        class_id: { type: string }
        organization_id: { type: string }
        teacher_ref: { type: string }
        name: { type: string }
        join_code: { type: string, description: "ABCD-EFGH; give it to guardians" }
        created_at: { type: number }
    ClassroomListed:
      allOf:
        - { $ref: "#/components/schemas/Classroom" }
        - type: object
          properties:
            learner_count:
              type: integer
              description: Learners the teacher can currently see (sharing progress), never hidden ones.
    ChildClass:
      type: object
      properties:
        class_id: { type: string }
        class_name: { type: string }
        organization_name: { type: string }
        teacher_display_name: { type: string }
        joined_at: { type: number }
        teacher_can_see_progress:
          type: boolean
          description: Live; progress_sharing (the master switch) and learning consent are both current.
    PublishedLesson:
      type: object
      properties:
        objective_code: { type: string }
        title:
          type: object
          additionalProperties: { type: string }
          description: Localized title by locale tag. No items, answers or other content.
    ClassDetail:
      allOf:
        - { $ref: "#/components/schemas/Classroom" }
        - type: object
          properties:
            learners:
              type: array
              items:
                type: object
                properties:
                  student_ref: { type: string }
                  display_name: { type: string }
                  joined_at: { type: number }
    JoinIn:
      type: object
      required: [classCode, studentRef, attestation]
      properties:
        classCode: { type: string }
        studentRef: { type: string }
        attestation:
          type: string
          maxLength: 500
          description: The sentence the guardian affirmed, stored verbatim as consent evidence.
    AssignmentIn:
      type: object
      required: [objectiveCode, dueAt]
      properties:
        objectiveCode: { type: string, maxLength: 64 }
        dueAt: { type: number, description: Unix seconds; must be in the future }
    Assignment:
      type: object
      properties:
        assignment_id: { type: string }
        class_id: { type: string }
        objective_code: { type: string }
        due_at: { type: number }
        assigned_by: { type: string }
        created_at: { type: number }
    ClassLearnerDetail:
      type: object
      properties:
        student_ref: { type: string }
        display_name: { type: string }
        class_id: { type: string }
        joined_at: { type: number }
        confidence: { type: string, enum: [low, medium, high] }
        next_action:
          type: ["object", "null"]
          properties:
            kind: { type: string }
            objective_code: { type: ["string", "null"] }
            reasons:
              type: array
              items: { $ref: "./ai-teacher.openapi.yaml#/components/schemas/Reason" }
        recommendations:
          type: array
          items: { $ref: "./ai-teacher.openapi.yaml#/components/schemas/ExplainedRecommendation" }
        placement:
          oneOf:
            - { $ref: "./ai-teacher.openapi.yaml#/components/schemas/PlacementSummary" }
            - { type: "null" }
    AssignmentProgress:
      allOf:
        - { $ref: "#/components/schemas/Assignment" }
        - type: object
          properties:
            overdue: { type: boolean }
            learners:
              type: array
              items:
                type: object
                properties:
                  student_ref: { type: string }
                  display_name: { type: string }
                  completed:
                    type: boolean
                    description: Practised this objective since it was assigned.
                  attempts_since_assigned: { type: integer }
                  mastery: { type: ["number", "null"] }
                  mastery_state: { type: string }
                  mastered: { type: boolean }
