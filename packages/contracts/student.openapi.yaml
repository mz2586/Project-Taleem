openapi: 3.1.0
info:
  title: Project Taleem — Student Query API
  version: 0.1.0
  description: >-
    Student-facing backend query surface (Phase 5.5): homework, assessments, revision queue,
    timetable, notifications, achievements, history, recommendations, the dashboard aggregate, and
    session hint requests. All DERIVED from existing learning data (Student Knowledge Model, evidence,
    outbox) — no new child-data tables. Authenticated (bearer JWT), authorized (read learning.knowledge),
    and IDOR-guarded: a learner reaches only their own data; mentors may read any. Governance-safe.
  license:
    name: Proprietary — license undecided; see repository LICENSE
servers:
  - url: https://api.taleem.dev
    description: Reference environment (placeholder; concrete host per FOUNDER_DECISIONS FD-02)
tags:
  - name: learning
    description: Student-facing learning queries.
paths:
  /v1/learning/sessions/{sessionId}:hint:
    post:
      tags: [learning]
      operationId: sessionHint
      summary: Next authored graduated hint for the current item (never the answer)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HintIn" } } }
      responses:
        "200": { description: Hint, content: { application/json: { schema: { $ref: "#/components/schemas/HintView" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/today:
    get:
      tags: [learning]
      operationId: studentToday
      summary: Dashboard aggregate (next action + mastery summary + due reviews)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Today, content: { application/json: { schema: { $ref: "#/components/schemas/TodayView" } } } }
        "403": { description: Forbidden, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/homework:
    get:
      tags: [learning]
      operationId: studentHomework
      summary: Homework items derived from published lessons
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Homework, content: { application/json: { schema: { $ref: "#/components/schemas/HomeworkView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/assessments:
    get:
      tags: [learning]
      operationId: studentAssessments
      summary: Available assessments (formative; summative flagged mentor-mediated)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Assessments, content: { application/json: { schema: { $ref: "#/components/schemas/AssessmentsView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/reviews:
    get:
      tags: [learning]
      operationId: studentReviews
      summary: Revision queue (due spaced-review objectives, risk-ordered)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Reviews, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewsView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/timetable:
    get:
      tags: [learning]
      operationId: studentTimetable
      summary: Suggested learning blocks derived from the plan
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Timetable, content: { application/json: { schema: { $ref: "#/components/schemas/TimetableView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/notifications:
    get:
      tags: [learning]
      operationId: studentNotifications
      summary: Calm in-app nudges (derived)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Notifications, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationsView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/notifications/{notificationId}:read:
    post:
      tags: [learning]
      operationId: markNotificationRead
      summary: Mark a notification read (client-tracked in this phase)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: studentRef, in: path, required: true, schema: { type: string } }
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Accepted }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/achievements:
    get:
      tags: [learning]
      operationId: studentAchievements
      summary: Earned recognitions (derived from learning events)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Achievements, content: { application/json: { schema: { $ref: "#/components/schemas/AchievementsView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/history:
    get:
      tags: [learning]
      operationId: studentHistory
      summary: Session + lesson history (own, de-identified)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: History, content: { application/json: { schema: { $ref: "#/components/schemas/HistoryView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/recommendations:
    get:
      tags: [learning]
      operationId: studentRecommendations
      summary: Learning recommendations (remediate / review / learn next)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Recommendations, content: { application/json: { schema: { $ref: "#/components/schemas/RecommendationsView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified bearer JWT. A learner may only access their own data (IDOR-guarded).
  schemas:
    HintIn:
      type: object
      required: [objective_code, item_ref]
      properties:
        objective_code: { type: string }
        item_ref: { type: string }
        hint_level: { type: integer, default: 0 }
    HintView:
      type: object
      properties:
        hint: { type: ["string", "null"] }
        level: { type: integer }
        exhausted: { type: boolean }
    TodayView:
      type: object
      properties:
        next_action:
          type: object
          properties:
            objective_code: { type: ["string", "null"] }
            reason: { type: string }
        mastery_summary:
          type: object
          properties:
            mastered: { type: integer }
            in_progress: { type: integer }
            total: { type: integer }
        revision_due_count: { type: integer }
    HomeworkView:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              item_ref: { type: string }
              objective_code: { type: string }
              prompt: { type: object, additionalProperties: { type: string } }
              status: { type: string, enum: [todo, done] }
              est_minutes: { type: integer }
    AssessmentsView:
      type: object
      properties:
        assessments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              objective_code: { type: string }
              type: { type: string, enum: [formative, summative] }
              item_count: { type: integer }
              mentor_mediated: { type: boolean }
    ReviewsView:
      type: object
      properties:
        due_count: { type: integer }
        reviews:
          type: array
          items:
            type: object
            properties:
              objective_code: { type: string }
              due_at: { type: number }
              last_seen_at: { type: number }
              mastery: { type: number }
              reason: { type: string }
    TimetableView:
      type: object
      properties:
        days:
          type: array
          items:
            type: object
            properties:
              day_offset: { type: integer }
              blocks:
                type: array
                items:
                  type: object
                  properties:
                    objective_code: { type: string }
                    est_minutes: { type: integer }
    NotificationsView:
      type: object
      properties:
        unread: { type: integer }
        notifications:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string }
              message: { type: string }
              read: { type: boolean }
              action: { type: string }
    AchievementsView:
      type: object
      properties:
        mastered_count: { type: integer }
        achievements:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
              earned_at: { type: number }
    HistoryView:
      type: object
      properties:
        sessions:
          type: array
          items:
            type: object
            properties:
              session_id: { type: string }
              objectives: { type: array, items: { type: string } }
              attempts: { type: integer }
              correct: { type: integer }
              at: { type: number }
        lessons:
          type: array
          items:
            type: object
            properties:
              objective_code: { type: string }
              attempts: { type: integer }
              last_at: { type: number }
    RecommendationsView:
      type: object
      properties:
        recommendations:
          type: array
          items:
            type: object
            properties:
              objective_code: { type: string }
              reason: { type: string, enum: [remediate, review, learn] }
              priority: { type: integer }
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
