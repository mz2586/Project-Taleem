openapi: 3.1.0
info:
  title: Project Taleem — AI Teacher API
  version: 0.1.0
  description: >-
    The AI Teacher (Phase 8): templated, curriculum-grounded, explainable teaching over the existing
    learning components — NO generative model (audit AR-C-06, no generative AI to children). Every
    explanation is a deterministic arrangement of authored lesson content, annotated with a calibrated
    confidence and a self-certified guardrail report (grounded / non-generative / in-curriculum /
    never reveals the answer / age-appropriate). Derived from existing data — no new child-data table.
    Authenticated (bearer JWT), authorized (operate learning.session / read learning.knowledge), and
    IDOR-guarded: a learner reaches only their own data; mentors may read any.
    Phase D (additive): an optional, flag-gated (default off), consent-gated generative tier may
    add a separate `generation` block to an explanation — a safety-gated rephrase marked
    `generated: true` with LessonView provenance. No real model provider is connected (FD-03).
  license:
    name: Proprietary — license undecided; see repository LICENSE
servers:
  - url: https://api.taleem.dev
    description: Reference environment (placeholder; concrete host per FOUNDER_DECISIONS FD-02)
tags:
  - name: ai-teacher
    description: AI Teacher — templated, curriculum-grounded, explainable (no LLM).
paths:
  /v1/learning/sessions/{sessionId}:explain:
    post:
      tags: [ai-teacher]
      operationId: aiTeacherExplain
      summary: A styled, grounded, confidence-annotated explanation (never the answer)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExplainIn" }
      responses:
        "200":
          description: Explanation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Explanation" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden (IDOR guard)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Session or published lesson not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/learning/students/{studentRef}/ai-teacher/plan:
    get:
      tags: [ai-teacher]
      operationId: aiTeacherPlan
      summary: Adaptive plan — weak topics, revision, personalized practice, next action
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentRef
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdaptivePlan" }
        "403":
          description: Forbidden (IDOR guard)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/learning/students/{studentRef}/ai-teacher/capabilities:
    get:
      tags: [ai-teacher]
      operationId: aiTeacherCapabilities
      summary: Offline capability matrix (what works offline vs needs connectivity)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentRef
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified bearer JWT. A learner may only access their own data (IDOR-guarded).
  schemas:
    ExplainIn:
      type: object
      required: [objective_code]
      properties:
        objective_code: { type: string }
        style:
          type: ["string", "null"]
          enum: [direct, worked_example_led, concrete_to_abstract, question_led, null]
          description: Optional; omit to let the deterministic policy choose by learner state.
        grade_band:
          type: string
          enum: [early, middle, senior]
          default: middle
        locale: { type: string, default: ur }
    Utterance:
      type: object
      properties:
        kind:
          type: string
          enum: [present, ask, hint, feedback, remediate]
        text: { type: string }
        locale: { type: string }
    Guardrail:
      type: object
      description: The AI Teacher's self-certification for a response.
      properties:
        grounded: { type: boolean, description: Every utterance is authored content or a system phrase }
        generative:
          type: boolean
          description: >-
            Always false — the guardrail certifies the authored `utterances`; any generated text is
            reported separately in `generation`.
        source: { type: string, description: '"authored"' }
        age_appropriate: { type: boolean }
        reveals_answer: { type: boolean, description: Always false }
        within_curriculum: { type: boolean }
        escalate: { type: boolean }
        escalate_reason: { type: string }
        confidence: { type: string, enum: [low, medium, high] }
    Explanation:
      type: object
      properties:
        objective_code: { type: string }
        style: { type: string, enum: [direct, worked_example_led, concrete_to_abstract, question_led] }
        utterances:
          type: array
          items: { $ref: "#/components/schemas/Utterance" }
        confidence: { type: string, enum: [low, medium, high] }
        grounded: { type: boolean }
        guardrail: { $ref: "#/components/schemas/Guardrail" }
        rationale:
          type: array
          items: { type: string }
        generation:
          $ref: "#/components/schemas/Generation"
    Generation:
      type: object
      description: >-
        Phase D generative tier. PRESENT ONLY when the `ai_teacher.generative_rephrase` feature flag
        is on (default off), a provider is configured (none is, per FD-03), the kill switch is
        disengaged, the learner is not being escalated, the guardian has live `ai_teaching`
        consent, and the learner's per-day inference quota is not exhausted; otherwise the key is
        absent and the response is
        byte-identical to the templated tier. `utterances` always remain the verified, authored
        curriculum text; generated text appears only in `explanation` below and must be labelled as
        generated by the client. A refused or failed rephrase is never softened: `explanation` is
        null and the authored `utterances` are the whole response. No real model provider is
        connected in this build (FD-03).
      required: [status, fallback, explanation]
      properties:
        status:
          type: string
          enum: [accepted, refused, unavailable]
          description: >-
            accepted — passed the safety gate; refused — the gate rejected the output;
            unavailable — the provider could not serve the call.
        fallback:
          type: ["string", "null"]
          enum: [authored, null]
          description: '"authored" when the authored utterances are served in place of a rephrase.'
        explanation:
          oneOf:
            - $ref: "#/components/schemas/GeneratedExplanation"
            - type: "null"
    GeneratedExplanation:
      type: object
      description: A safety-gated rephrase of the authored utterances. NOT verified curriculum text.
      required:
        [text, locale, generated, verified, notice_key, source, lesson_id, objective_code, grounded_on]
      properties:
        text: { type: string }
        locale: { type: string }
        generated:
          type: boolean
          const: true
          description: Always true — distinguishes generated explanation from verified content.
        verified:
          type: boolean
          const: false
          description: >-
            Always false — the gate checks grounding lexically and cannot vouch for the rephrase.
            The verified version is the authored `utterances`.
        verified_source: { type: string, const: utterances }
        notice_key:
          type: string
          description: >-
            i18n key of the notice the client MUST show beside generated text (an AI-written
            rephrase, not verified curriculum fact).
        source: { type: string, const: generated }
        lesson_id: { type: string }
        objective_code: { type: string }
        grounded_on:
          type: array
          description: >-
            Provenance — the published LessonView fields the rephrase was grounded on, e.g.
            "lesson.explanation.en", "lesson.worked_example_steps[2]".
          items: { type: string }
        provider: { type: string, description: The gateway adapter that produced the text }
        tier: { type: string, enum: [light, standard, deep, safety] }
    WeakTopic:
      type: object
      properties:
        objective_code: { type: string }
        state: { type: string }
        mastery: { type: number }
        active_misconceptions:
          type: array
          items: { type: string }
        reason: { type: string }
    PracticeItem:
      type: object
      properties:
        objective_code: { type: string }
        difficulty: { type: string, enum: [INTRO, CORE, STRETCH] }
        confidence: { type: string, enum: [low, medium, high] }
    AdaptivePlan:
      type: object
      properties:
        next_action:
          type: object
          properties:
            kind: { type: string }
            objective_code: { type: ["string", "null"] }
            rationale:
              type: array
              items:
                type: object
                properties:
                  rule_id: { type: string }
                  note: { type: string }
        weak_topics:
          type: array
          items: { $ref: "#/components/schemas/WeakTopic" }
        revision_due:
          type: array
          items: { type: string }
        practice:
          type: array
          items: { $ref: "#/components/schemas/PracticeItem" }
        confidence: { type: string, enum: [low, medium, high] }
        rationale:
          type: array
          items: { type: string }
    Capabilities:
      type: object
      properties:
        offline:
          type: object
          additionalProperties: { type: string }
          description: capability name -> availability (available / queued / cached / disabled_offline)
    Problem:
      type: object
      description: RFC 9457 problem+json.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
