openapi: 3.1.0
info:
  title: Project Taleem — Identity, Consent & Child-Safe Sign-In API
  version: 0.1.0
  description: >-
    Guardian accounts, verifiable parental consent, learner enrolment, and the child-safe sign-in
    journey (FD-14). Production token cryptography (EdDSA + rotating JWKS) already existed; this
    surface is the journey on top of it.


    Child-safety properties this contract commits to:


    * A learner has no email address, no phone number, and no recoverable credential. A child is
      created by a guardian and signs in with a family code, their own display name, and a short
      PIN.
    * `POST /v1/identity/learners:signin` denies sign-in unless live, un-withdrawn, current-policy
      guardian consent exists. Withdrawal takes effect on the next attempt.
    * Every sign-in failure returns one identical `401` regardless of cause, so no endpoint here is
      an enumeration oracle. `learners:roster` returns an empty list for an unknown family code.
    * Consent and audit are append-only. A withdrawal is a new record; nothing is edited or deleted.
    * Guardian-scoped routes derive the acting guardian from the verified token subject, never from
      the request body. A learner belonging to another family is reported `404`, not `403`, so a
      probe cannot confirm the ref names a real child elsewhere.
    * Every domain validation failure is a `422` problem whose `code` stays `VALIDATION_FAILED`
      (compatibility) and whose single `errors[0].code` carries a stable reason a client can
      localize — see `ValidationProblem`. The English `detail` is for logs, not for display.
      Schema-level body errors (a missing or mistyped field) still use the framework's own
      `422` body, and an unknown consent scope keeps its own top-level code
      `UNKNOWN_CONSENT_SCOPE`.
    * The `learners:*` routes are halted by the operator kill switch; guardian routes are not, so a
      guardian can still withdraw consent during an incident.
  license:
    name: Proprietary — license undecided; see repository LICENSE
servers:
  - url: https://api.taleem.dev
    description: Reference environment (placeholder; concrete host per FOUNDER_DECISIONS FD-02)
tags:
  - name: identity
    description: Guardian accounts, consent, learner enrolment, child-safe sign-in.
paths:
  /v1/identity/guardians:
    post:
      tags: [identity]
      operationId: registerGuardian
      summary: Register a guardian account
      security: []  # public: this is how a caller obtains a token
      description: >-
        Public. Creates an adult account with a family code and returns a first session. Rate
        limited per client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianRegistration" }
      responses:
        "201":
          description: Account created; session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianSession" }
        "409":
          description: An account already exists for this email address
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Validation failed (email shape, passphrase policy, display name)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/guardians:signin:
    post:
      tags: [identity]
      operationId: signInGuardian
      summary: Sign in a guardian
      security: []  # public: this is how a caller obtains a token
      description: >-
        Public. An unknown address and a wrong passphrase return the same `401` with the same
        detail, and take comparable time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianCredentials" }
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianSession" }
        "401":
          description: Sign-in details are not correct (uniform for every cause)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/guardians:recover:
    post:
      tags: [identity]
      operationId: recoverGuardian
      summary: Set a new passphrase with a one-time recovery code
      security: []  # public: the guardian has forgotten the credential that would get a token
      description: >-
        Public; no email is involved. Consumes one recovery code, sets the new passphrase (passphrase
        policy enforced), lifts a passphrase lockout (never an operator suspension), revokes every
        existing guardian session, and returns a new session. Every failure — unknown email,
        malformed, wrong or already-used code, recovery locked after repeated wrong codes, suspended
        account — is the same `401` with the same detail as a failed sign-in, and takes comparable
        time. Rate limited per client and per account. Audited as `guardian.recovered` /
        `guardian.recovery_failed` / `guardian.recovery_locked`; no code ever appears in the audit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianRecovery" }
      responses:
        "200":
          description: Passphrase changed; every older session revoked; a new session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianRecovered" }
        "401":
          description: Recovery details are not correct (uniform for every cause)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: The new passphrase fails the policy (PASSPHRASE_*); says nothing about the account
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }
        "429":
          description: Rate limited (per client or per account)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/guardians/me/recovery-codes:
    post:
      tags: [identity]
      operationId: regenerateRecoveryCodes
      summary: Make a new set of recovery codes (shown once)
      security: [{ bearerAuth: [] }]
      description: >-
        Requires the current passphrase; a wrong one counts towards the sign-in lockout and is a
        `403 PASSPHRASE_INCORRECT` (not a `401`, so a client does not refresh and resubmit). The
        previous set stops working at once. The codes are in this response only — the server
        keeps PBKDF2 digests. Audited as `guardian.recovery_codes_generated` (counts only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryCodesRequest" }
      responses:
        "200":
          description: The new codes, once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodesIssued" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Not a guardian token, account suspended, or PASSPHRASE_INCORRECT
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/learners:roster:
    post:
      tags: [identity]
      operationId: getFamilyRoster
      summary: Display names for one family code, so a child taps rather than types
      security: []  # public: guarded by the family code, rate limiting, and the kill switch
      description: >-
        Public, rate limited. A `POST` because the family code is a shared secret and must not land
        in a URL, a proxy log, or browser history. Returns display names and grade levels only — no
        refs, no progress. An unknown code returns an empty list, indistinguishable from a family
        with no learners. Halted by the kill switch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyCodeRequest" }
      responses:
        "200":
          description: Roster (possibly empty)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterResponse" }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: Halted by the operator kill switch
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/learners:signin:
    post:
      tags: [identity]
      operationId: signInLearner
      summary: Sign in a learner (family code + display name + PIN)
      security: []  # public: this is how a learner obtains a token
      description: >-
        Public, rate limited, and gated on live guardian consent. Five wrong PINs lock the learner
        account durably; the owning guardian unlocks it by resetting the PIN. Halted by the kill
        switch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearnerCredentials" }
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerSession" }
        "401":
          description: >-
            Sign-in details are not correct. Returned identically for an unknown family code, an
            unknown learner, a wrong PIN, and a locked account.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: >-
            `CONSENT_REQUIRED` — the credential was correct but no current guardian consent covers
            this learner. Distinguished from `401` on purpose: the caller already holds the family
            code, the name, and the PIN, so this leaks nothing, and it is what tells the child to
            hand the device to their guardian instead of retrying a correct PIN.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: Halted by the operator kill switch
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/sessions:refresh:
    post:
      tags: [identity]
      operationId: refreshSession
      summary: Exchange a rotating refresh token for a fresh access token
      security: []  # public: the refresh token is itself the credential
      description: >-
        Session continuity that never outlives permission. Refreshing re-runs every gate that
        applied at sign-in — account status and, for a learner, the derived consent state — so a
        withdrawn consent, a locked account, or a reset PIN stops the session here rather than
        thirty days later.


        The token is opaque, single-use, and rotated: the response carries a successor and the
        presented token is consumed. Presenting a consumed token is treated as theft (the legitimate
        holder and a thief hold members of the same chain and are indistinguishable) and revokes the
        entire rotation family. A token bound to a device is refused from any other.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New access token and successor refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshedSession" }
        "401":
          description: >-
            Uniform sign-in failure — unknown token, wrong secret, expired, revoked, wrong device,
            or a consumed token being replayed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`CONSENT_REQUIRED` — consent lapsed while the session was live"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/sessions:signout:
    post:
      tags: [identity]
      operationId: signOut
      summary: End a session
      security: []  # public: the refresh token is itself the credential
      description: >-
        Revokes the presented token's whole rotation family. Idempotent, and deliberately identical
        for a token that never existed — signing out must not become a way to probe token validity.
        Signing out on one device does not end sessions on another, because each sign-in starts its
        own family.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignOutRequest" }
      responses:
        "200":
          description: Signed out (always, whatever was presented)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignOutResult" }
        "422":
          description: Malformed request body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/policy:
    get:
      tags: [identity]
      operationId: getConsentPolicy
      summary: The consent scope vocabulary and current policy version
      security: []  # public: contains no account data
      description: Public — contains no account data. Clients render the consent form from this.
      responses:
        "200":
          description: Policy descriptor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDescriptor" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/me:
    get:
      tags: [identity]
      operationId: getGuardianIdentityProfile
      summary: The acting guardian, their family code, and their learners
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Guardian profile with per-learner consent state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianProfile" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden (not a guardian token)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No such guardian account
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/learners:
    get:
      tags: [identity]
      operationId: listLearners
      summary: The acting guardian's own learners
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Learners with consent state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerList" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    post:
      tags: [identity]
      operationId: enrolLearner
      summary: Enrol a child into the acting guardian's family
      description: >-
        A newly enrolled learner cannot sign in until the guardian grants consent — enrol, then
        consent, then learn. Display names are unique within a family because the name is the
        child's sign-in handle there.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearnerEnrolment" }
      responses:
        "201":
          description: Learner enrolled (cannot sign in until consent is granted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: PIN policy, duplicate display name, or family size limit
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/learners/{studentRef}/pin:reset:
    post:
      tags: [identity]
      operationId: resetLearnerPin
      summary: Reset a learner's PIN (also unlocks a locked learner)
      description: >-
        The only recovery path for a child, because a child has no address a reset link could be
        sent to. Owner-only; another family's learner is `404`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentRef
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinReset" }
      responses:
        "200":
          description: PIN reset; learner reactivated if it was locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Not this guardian's learner
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: PIN policy
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/learners/{studentRef}:
    patch:
      tags: [identity]
      operationId: renameLearner
      summary: Rename a learner (display name only)
      description: >-
        The display name is the only editable field, and no other field is accepted (an unknown
        property is a `422`). It stays unique within the family because it is the child's
        sign-in handle there. Audited as `learner.renamed`; the audit entry records that the
        name changed, never the name itself. Owner-only; another family's learner is `404`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentRef
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearnerRename" }
      responses:
        "200":
          description: Learner renamed (a no-op when the name is unchanged)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden (not a guardian)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Not this guardian's learner
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: DISPLAY_NAME_* or DUPLICATE_LEARNER_NAME
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/learners/{studentRef}:suspend:
    post:
      tags: [identity]
      operationId: suspendLearner
      summary: Suspend (pause) a learner — sign-in stops and every session ends now
      description: >-
        Sets `status` to `paused`, blocks sign-in, and revokes every refresh-token family for
        the learner immediately, so no device can refresh; an already-issued access token is
        refused on its next learner request by the per-request learner gate (`LEARNER_INACTIVE`).
        Idempotent. An operator-`suspended` learner stays
        `suspended`. Audited as `learner.suspended` with the number of sessions revoked.
        Owner-only; another family's learner is `404`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentRef
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Learner paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden (not a guardian)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Not this guardian's learner
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/learners/{studentRef}:reinstate:
    post:
      tags: [identity]
      operationId: reinstateLearner
      summary: Lift the guardian's own suspension
      description: >-
        `paused` becomes `active` and the failed-PIN counter is cleared. Idempotent for a
        learner that is not paused. Consent is untouched: a learner without consent still
        cannot sign in. An operator suspension cannot be lifted here (`409`
        `LEARNER_SUSPENDED_BY_OPERATOR`). Audited as `learner.reinstated`. Owner-only; another
        family's learner is `404`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentRef
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Learner active again (or unchanged)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learner" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden (not a guardian)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Not this guardian's learner
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Suspended by an operator
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/consents:
    post:
      tags: [identity]
      operationId: grantConsent
      summary: Grant guardian consent for one learner
      description: >-
        Appends an immutable consent record carrying the policy version and the evidence of capture
        (method, hashed client context, the attestation sentence). Must include `learning_data`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentGrant" }
      responses:
        "200":
          description: Derived consent state after the grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentState" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden (only a guardian may consent — not an operator)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Not this guardian's learner
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Unknown scope, or the required `learning_data` scope was omitted
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/consents:withdraw:
    post:
      tags: [identity]
      operationId: withdrawConsent
      summary: Withdraw some or all consent scopes for one learner
      description: >-
        Omitting `scopes` withdraws everything — the guardian's stop button. Takes effect on the
        learner's next sign-in attempt, not when a cached claim expires.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentWithdrawal" }
      responses:
        "200":
          description: Derived consent state after the withdrawal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentState" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Not this guardian's learner
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/consents/{studentRef}:
    get:
      tags: [identity]
      operationId: getConsentState
      summary: Current consent state plus the full append-only history for one learner
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentRef
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Consent state with history, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentStateWithHistory" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Not this guardian's learner
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/staff:
    post:
      tags: [identity]
      operationId: createStaff
      summary: Provision a Curriculum Studio staff account (operator)
      description: >-
        `system` only. Creates an adult staff account holding exactly one staff role: a Studio role
        (`subject_author`, `subject_expert`, `instructional_designer`, `a11y_specialist`,
        `language_editor`, `safety_officer`, `curriculum_architect`) or `safeguarding_lead` (the
        safeguarding triage console, which holds no Studio permission). No other role can be
        requested, and the database refuses any other value. The `staff_ref` is the stable,
        pseudonymous token subject the Studio uses to block self-approval, so one person must
        hold one account per role and never share it. Audited as `staff.created`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffCreate" }
      responses:
        "201":
          description: Staff account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden (operator only)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: A staff account already has this email
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: EMAIL_INVALID, PASSPHRASE_*, DISPLAY_NAME_*, or STAFF_ROLE_INVALID
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    get:
      tags: [identity]
      operationId: listStaff
      summary: List staff accounts (operator)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Staff accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffList" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden (operator only)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/staff/{staffRef}:suspend:
    post:
      tags: [identity]
      operationId: suspendStaff
      summary: Suspend a staff account (operator) — effective on the next request
      description: >-
        Sign-in stops, every refresh family is revoked, and the per-request staff gate refuses
        the account's live access token on its next Studio request (`403 STAFF_INACTIVE`).
        Audited as `staff.suspended` with the number of sessions revoked.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: staffRef
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Staff account suspended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden (operator only)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No such staff account
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/staff/{staffRef}:reinstate:
    post:
      tags: [identity]
      operationId: reinstateStaff
      summary: Lift a suspension or a lockout (operator)
      description: >-
        The only unlock path after ten wrong passphrases. Clears the failure counter. Audited
        as `staff.reinstated`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: staffRef
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Staff account active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden (operator only)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No such staff account
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/staff:signin:
    post:
      tags: [identity]
      operationId: signInStaff
      summary: Staff passphrase sign-in
      security: []  # public: this is how a staff member obtains a token
      description: >-
        Public and rate limited per client (shared across instances). Every failure — unknown
        email, wrong passphrase, suspended or locked account — is the same `401`. Ten wrong
        passphrases lock the account until an operator reinstates it. Returns a 60-minute
        access token whose `role` is the account's one Studio role and whose `subject` is the
        `staff_ref`, plus a rotating refresh token (12-hour idle lifetime) for
        `sessions:refresh` / `sessions:signout`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffCredentials" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSession" }
        "401":
          description: Uniform sign-in failure
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/staff/me:
    get:
      tags: [identity]
      operationId: getStaffSelf
      summary: The signed-in staff member's own account
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Staff account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Not a staff token, or `STAFF_INACTIVE`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No staff account for this subject
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/staff/me:passphrase:
    post:
      tags: [identity]
      operationId: changeStaffPassphrase
      summary: Replace the passphrase the operator set
      description: >-
        Requires the current passphrase (a wrong one counts towards the lockout). Every
        session for the account ends, so a passphrase the operator knew stops working at once.
        Audited as `staff.passphrase_changed`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffPassphraseChange" }
      responses:
        "200":
          description: Passphrase changed; sign in again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffPassphraseChanged" }
        "401":
          description: Unauthorized, or the current passphrase is wrong
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Not a staff token
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: PASSPHRASE_*
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ValidationProblem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/identity/audit:
    get:
      tags: [identity]
      operationId: getIdentityAuditTrail
      summary: Append-only identity audit trail for the acting guardian's own family
      description: >-
        Answers "who signed in as my child, and when". Scoped to the guardian and their own
        learners; refs and hashes only, never names or addresses.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Audit events, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditTrail" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GuardianRegistration:
      type: object
      required: [email, passphrase, displayName]
      properties:
        email: { type: string, maxLength: 254 }
        passphrase: { type: string, minLength: 10, maxLength: 256 }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        locale: { type: string, default: "ur" }
    GuardianCredentials:
      type: object
      required: [email, passphrase]
      properties:
        email: { type: string }
        passphrase: { type: string }
    Session:
      type: object
      description: A signed access token. EdDSA in production; HS256 on the dev path only.
      properties:
        access_token: { type: string }
        token_type: { type: string, const: "Bearer" }
        expires_at: { type: integer, description: Unix seconds }
        expires_in: { type: integer }
        role:
          type: string
          enum: [guardian, student, subject_author, subject_expert, instructional_designer,
            a11y_specialist, language_editor, safety_officer, curriculum_architect]
        subject: { type: string }
    Guardian:
      type: object
      properties:
        guardian_ref: { type: string }
        email: { type: string }
        display_name: { type: string }
        family_code:
          type: string
          description: >-
            The guardian-held secret that scopes their learner roster, e.g. `K7QM-3XPZ`. Excludes
            characters that are misread when spoken aloud.
        locale: { type: string }
        status: { type: string, enum: [active, locked, suspended] }
        created_at: { type: number }
    RefreshTokenValue:
      type: string
      description: >-
        Opaque, single-use, high-entropy. Format is `<token id>.<secret>` so lookup is a primary-key
        read; only the SHA-256 digest of the secret is stored server-side. Never a JWT — it cannot
        be verified without the database, which is what makes revocation real. Treat it as a
        credential: store it where the access token is stored and never place it in a URL.
    GuardianSession:
      type: object
      properties:
        guardian: { $ref: "#/components/schemas/Guardian" }
        session: { $ref: "#/components/schemas/Session" }
        refresh_token: { $ref: "#/components/schemas/RefreshTokenValue" }
        recovery_codes:
          description: >-
            Registration only: the guardian's first recovery codes, shown once. Absent from a
            sign-in response.
          $ref: "#/components/schemas/RecoveryCodeList"
        recovery: { $ref: "#/components/schemas/RecoveryStatus" }
    RecoveryCodeList:
      type: array
      minItems: 8
      maxItems: 8
      description: >-
        Eight single-use codes, `XXXX-XXXX-XXXX` from the family-code alphabet (about 59 bits
        each). Plaintext exists only in the response that created them; only PBKDF2 digests are
        stored. Input is accepted in lower case and without dashes or spaces.
      items: { type: string, pattern: "^[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}$" }
    RecoveryStatus:
      type: object
      description: Counts and times only — never a code or a digest.
      properties:
        total: { type: integer, description: Codes in the current set }
        remaining: { type: integer, description: Unused codes in the current set }
        generated_at: { type: [number, "null"] }
        last_used_at: { type: [number, "null"] }
    GuardianRecovery:
      type: object
      required: [email, code, newPassphrase]
      properties:
        email: { type: string, maxLength: 320 }
        code: { type: string, maxLength: 64, description: One recovery code }
        newPassphrase: { type: string, minLength: 10, maxLength: 256 }
    GuardianRecovered:
      type: object
      properties:
        guardian: { $ref: "#/components/schemas/Guardian" }
        session: { $ref: "#/components/schemas/Session" }
        refresh_token: { $ref: "#/components/schemas/RefreshTokenValue" }
        recovery: { $ref: "#/components/schemas/RecoveryStatus" }
    RecoveryCodesRequest:
      type: object
      required: [passphrase]
      properties:
        passphrase: { type: string, description: The current passphrase }
    RecoveryCodesIssued:
      type: object
      properties:
        recovery_codes: { $ref: "#/components/schemas/RecoveryCodeList" }
        recovery: { $ref: "#/components/schemas/RecoveryStatus" }
    GuardianProfile:
      type: object
      properties:
        guardian: { $ref: "#/components/schemas/Guardian" }
        learners:
          type: array
          items: { $ref: "#/components/schemas/Learner" }
        policy_version: { type: string }
        recovery: { $ref: "#/components/schemas/RecoveryStatus" }
    LearnerEnrolment:
      type: object
      required: [displayName, pin]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"
          description: 4–6 digits. Most-guessed sequences are refused.
        gradeBand: { type: string, enum: [early, middle, senior], default: middle }
        gradeLevel: { type: integer, minimum: 0, maximum: 12, default: 4 }
        locale: { type: string, default: "ur" }
    Learner:
      type: object
      description: >-
        A child. Note what is absent by design: no email, no phone, no date of birth, no address.
      properties:
        student_ref: { type: string }
        display_name: { type: string }
        grade_band: { type: string, enum: [early, middle, senior] }
        grade_level: { type: integer }
        locale: { type: string }
        status:
          type: string
          enum: [active, locked, paused, suspended]
          description: >-
            `locked`: too many wrong PINs (a PIN reset unlocks). `paused`: the guardian suspended
            this learner (`:suspend`; lifted by `:reinstate`). `suspended`: an operator hold that
            a guardian cannot lift. Only `active` can sign in.
        created_at: { type: number }
        consent: { $ref: "#/components/schemas/ConsentState" }
        can_sign_in:
          type: boolean
          description: True only when the account is active *and* consent permits sign-in.
    LearnerList:
      type: object
      properties:
        learners:
          type: array
          items: { $ref: "#/components/schemas/Learner" }
    LearnerRename:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
    PinReset:
      type: object
      required: [pin]
      properties:
        pin: { type: string, pattern: "^[0-9]{4,6}$" }
    FamilyCodeRequest:
      type: object
      required: [familyCode]
      properties:
        familyCode: { type: string, maxLength: 16 }
    RosterEntry:
      type: object
      description: Display names only — deliberately no refs, grades aside, and no progress.
      properties:
        display_name: { type: string }
        grade_level: { type: integer }
    RosterResponse:
      type: object
      properties:
        learners:
          type: array
          items: { $ref: "#/components/schemas/RosterEntry" }
    LearnerCredentials:
      type: object
      required: [familyCode, displayName, pin]
      properties:
        familyCode: { type: string }
        displayName: { type: string }
        pin: { type: string, pattern: "^[0-9]{4,6}$" }
        deviceId:
          type: string
          maxLength: 64
          description: >-
            Opaque, client-generated, and rotatable by clearing site data. Used to show a guardian
            where their child learns and to bind offline packages — never a tracking identifier.
    LearnerSession:
      type: object
      properties:
        learner: { $ref: "#/components/schemas/Learner" }
        session: { $ref: "#/components/schemas/Session" }
        consent: { $ref: "#/components/schemas/ConsentState" }
        refresh_token: { $ref: "#/components/schemas/RefreshTokenValue" }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { $ref: "#/components/schemas/RefreshTokenValue" }
        deviceId:
          type: string
          maxLength: 64
          description: Must match the device the token was bound to at sign-in.
    RefreshedSession:
      type: object
      description: >-
        Carries `learner` + `consent` for a student session, `guardian` for a guardian session,
        or `staff` for a Curriculum Studio staff session (same role, same subject).
      properties:
        session: { $ref: "#/components/schemas/Session" }
        refresh_token: { $ref: "#/components/schemas/RefreshTokenValue" }
        learner: { $ref: "#/components/schemas/Learner" }
        consent: { $ref: "#/components/schemas/ConsentState" }
        guardian: { $ref: "#/components/schemas/Guardian" }
        staff: { $ref: "#/components/schemas/Staff" }
    SignOutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { $ref: "#/components/schemas/RefreshTokenValue" }
    SignOutResult:
      type: object
      properties:
        signed_out: { type: boolean, const: true }
    ConsentScope:
      type: string
      enum: [learning_data, ai_teaching, voice_audio, progress_sharing]
      description: >-
        Separable because they carry different risk: a guardian may allow curriculum learning while
        refusing AI-generated teaching. `learning_data` is required — without it the platform holds
        no learning record, so there is nothing to sign a child in for.
    ConsentGrant:
      type: object
      required: [studentRef, scopes]
      properties:
        studentRef: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/ConsentScope" }
        attestation:
          type: string
          maxLength: 500
          description: The exact sentence the guardian affirmed, stored verbatim as evidence.
    ConsentWithdrawal:
      type: object
      required: [studentRef]
      properties:
        studentRef: { type: string }
        scopes:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ConsentScope" }
          description: Omit or send null to withdraw every scope.
        attestation: { type: string, maxLength: 500 }
    ConsentState:
      type: object
      description: Derived by folding the append-only consent history — not a stored flag.
      properties:
        student_ref: { type: string }
        granted_scopes:
          type: array
          items: { $ref: "#/components/schemas/ConsentScope" }
        policy_version: { type: string }
        current_policy_version: { type: string }
        policy_current:
          type: boolean
          description: >-
            False once the policy version is superseded. Consent under a superseded version does
            not permit sign-in: a material change requires fresh agreement, not inheritance.
        permits_sign_in: { type: boolean }
        granted_at: { type: number }
        last_change_at: { type: number }
    ConsentHistoryEntry:
      type: object
      properties:
        consent_id: { type: string }
        action: { type: string, enum: [granted, withdrawn] }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/ConsentScope" }
        policy_version: { type: string }
        recorded_at: { type: number }
        method: { type: string }
    ConsentStateWithHistory:
      allOf:
        - $ref: "#/components/schemas/ConsentState"
        - type: object
          properties:
            history:
              type: array
              items: { $ref: "#/components/schemas/ConsentHistoryEntry" }
    PolicyScope:
      type: object
      properties:
        key: { $ref: "#/components/schemas/ConsentScope" }
        required: { type: boolean }
    PolicyDescriptor:
      type: object
      properties:
        policy_version: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/PolicyScope" }
    AuditEvent:
      type: object
      properties:
        event_id: { type: string }
        at: { type: number }
        action:
          type: string
          description: >-
            e.g. `guardian.registered`, `learner.created`, `consent.granted`, `consent.withdrawn`,
            `learner.signed_in`, `learner.sign_in_failed`,
            `learner.sign_in_denied_no_consent`, `learner.locked`, `learner.pin_reset`,
            `guardian.recovery_codes_generated`, `guardian.recovered`,
            `guardian.recovery_failed`, `guardian.recovery_locked`.
        actor_ref: { type: string }
        actor_role: { type: string }
        subject_ref: { type: string }
        correlation_id: { type: string }
        detail: { type: object, additionalProperties: true }
    AuditTrail:
      type: object
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
    StaffRole:
      type: string
      enum: [subject_author, subject_expert, instructional_designer, a11y_specialist,
        language_editor, safety_officer, curriculum_architect, safeguarding_lead]
      description: >-
        The seven Curriculum Studio roles, plus `safeguarding_lead` (the safeguarding triage console;
        safeguarding.openapi.yaml). A staff account holds exactly one.
    StaffCreate:
      type: object
      additionalProperties: false
      required: [email, passphrase, displayName, role]
      properties:
        email: { type: string, maxLength: 254 }
        passphrase: { type: string, minLength: 10, maxLength: 256 }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        role: { $ref: "#/components/schemas/StaffRole" }
    StaffCredentials:
      type: object
      required: [email, passphrase]
      properties:
        email: { type: string }
        passphrase: { type: string }
    Staff:
      type: object
      properties:
        staff_ref: { type: string, description: "Stable pseudonymous token subject (stf_…)" }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/StaffRole" }
        status: { type: string, enum: [active, locked, suspended] }
        created_at: { type: number }
    StaffList:
      type: object
      properties:
        staff:
          type: array
          items: { $ref: "#/components/schemas/Staff" }
    StaffSession:
      type: object
      properties:
        staff: { $ref: "#/components/schemas/Staff" }
        session: { $ref: "#/components/schemas/Session" }
        refresh_token: { $ref: "#/components/schemas/RefreshTokenValue" }
    StaffPassphraseChange:
      type: object
      required: [current, newPassphrase]
      properties:
        current: { type: string }
        newPassphrase: { type: string, minLength: 10, maxLength: 256 }
    StaffPassphraseChanged:
      type: object
      properties:
        changed: { type: boolean }
        revoked_sessions: { type: integer }
    ValidationProblem:
      description: >-
        A `422` from a domain rule. `code` is always `VALIDATION_FAILED`; `errors` holds exactly
        one entry whose `code` is the stable reason. Reasons: `EMAIL_INVALID`,
        `PASSPHRASE_TOO_SHORT`, `PASSPHRASE_TOO_LONG`, `PASSPHRASE_WHITESPACE`,
        `DISPLAY_NAME_EMPTY`, `DISPLAY_NAME_TOO_LONG`, `DISPLAY_NAME_INVALID_CHARACTERS`,
        `PIN_FORMAT`, `PIN_TOO_EASY`, `GRADE_BAND_INVALID`, `GRADE_LEVEL_INVALID`,
        `DUPLICATE_LEARNER_NAME`, `LEARNER_LIMIT_REACHED`, `CONSENT_SCOPE_REQUIRED`, `STAFF_ROLE_INVALID`. New reasons
        may be added; a client should fall back to a generic message for one it does not know.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            code: { type: string, const: VALIDATION_FAILED }
            errors:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    examples: [PIN_TOO_EASY, DUPLICATE_LEARNER_NAME]
                  field:
                    type: string
                    description: The request field concerned (camelCase), when there is one.
                  message: { type: string, description: "English, for logs only." }
    Problem:
      type: object
      description: RFC 9457 problem+json.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
