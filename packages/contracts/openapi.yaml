openapi: 3.1.0
info:
  title: Project Taleem — Core API
  version: 0.1.0
  description: >-
    Core API root contract (health, metrics, offline sync, auth seam). Contract-first
    (docs/10-api-design.md). Learning, curriculum-studio, offline, ai-teacher, guardian, and ops
    surfaces have their own contracts. Governance-gated: no enrolment or real child accounts.
  license:
    name: Proprietary — license undecided; see repository LICENSE
servers:
  - url: https://api.taleem.dev
    description: Reference environment (placeholder; concrete host per FOUNDER_DECISIONS FD-02)
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: observability
    description: Metrics exposition for monitoring.
  - name: sync
    description: >-
      Offline sync (Phase 6.2B). attempt.submitted deltas durably record AssessmentEvidence
      (idempotent by client-generated evidence_id); homework.submitted deltas are applied by the
      school service exactly as the online homework submit (idempotent by the client
      submission_key); progress / lesson.completed / preference keep the in-memory conflict policy
      (monotonic max / idempotent set / server-order-wins).
  - name: skeleton
    description: Authentication and authorization seam demonstration.
paths:
  /health:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness
      security: []
      responses:
        "200":
          description: Service is live
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness (dependency probes)
      security: []
      responses:
        "200": { description: Ready }
        "503":
          description: Degraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /metrics:
    get:
      tags: [observability]
      operationId: getMetrics
      summary: Prometheus metrics exposition
      security: []
      responses:
        "200":
          description: Metrics
          content:
            text/plain:
              schema: { type: string }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/sync/batch:
    post:
      tags: [sync]
      operationId: postSyncBatch
      summary: Offline sync batch (idempotent; durable evidence for attempts)
      description: >-
        Applies client-generated deltas with the remediated conflict policy (docs/33 §6): idempotent
        on clientEventId, append-only by union, monotonic progress, server-version ordering (no
        client wall-clock). Phase 6.2B: an attempt.submitted delta is graded server-side against the
        published lesson and durably recorded as AssessmentEvidence via LearningUnitOfWork, keyed on
        a client-generated evidence_id so a replay (even after a server restart) is a DUPLICATE.
        A summative item is never auto-graded by sync (mentor-mediated). See AttemptPayload.
        A homework.submitted delta (a written homework answer sent while offline) is applied by the
        same school service as POST /v1/school/learners/{student_ref}/homework/…:submit — the same
        auto-marking, self-check and compare view, disclosure screen, cohort filtering and
        SHARING_REQUIRED — and is idempotent by its submission_key (a replay is a DUPLICATE with
        the current view). A refusal is a per-item conflict with a reason; it is not remembered, so
        the same answer can be re-sent. See HomeworkPayload and ItemResult.reason / result.
        Authenticated (bearer JWT) and IDOR-guarded: an attempt.submitted delta's student_ref must
        match the token subject (a privileged operator may sync any) — a learner cannot forge
        assessment evidence for another child. A homework.submitted delta's student_ref must match
        the token subject, with no operator exception (as on the online submit route). Consent-gated: every learner the batch writes for
        (each attempt's student_ref, and the caller when it is a learner) is re-checked against
        live identity state on every batch; a learner without current learning_data consent
        (CONSENT_REQUIRED) or whose account is not active (LEARNER_INACTIVE) rejects the WHOLE
        batch with 403 and nothing is applied, so the client can hold and later re-send it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchIn"
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResult"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: >-
            Forbidden — an attempt or homework answer targets another learner (FORBIDDEN), or the
            learner lacks live consent (CONSENT_REQUIRED) or is not active (LEARNER_INACTIVE).
            Nothing is applied.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Validation / unknown delta type / missing student_ref
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/skeleton/protected:
    get:
      tags: [skeleton]
      operationId: getProtected
      summary: AuthN(JWT) + AuthZ(PDP deny-by-default) seam demo
      security:
        - bearerAuth: []
      responses:
        "200": { description: Allowed }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden (deny-by-default)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Readiness:
      type: object
      properties:
        status: { type: string, example: degraded }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: boolean }
    DeltaIn:
      type: object
      required: [clientEventId, type, entityKey]
      properties:
        clientEventId: { type: string, maxLength: 128 }
        type:
          type: string
          enum: [progress.updated, lesson.completed, attempt.submitted, preference.set, homework.submitted]
        entityKey: { type: string, maxLength: 256 }
        payload:
          description: >-
            By type: attempt.submitted → AttemptPayload; homework.submitted → HomeworkPayload; any
            other type → a free-form object (progress / completion / preference).
          anyOf:
            - $ref: "#/components/schemas/AttemptPayload"
            - $ref: "#/components/schemas/HomeworkPayload"
            - { type: object, additionalProperties: true }
        clientSeq: { type: integer, default: 0 }
    AttemptPayload:
      type: object
      description: >-
        Shape of an attempt.submitted delta's payload (Phase 6.2B). Carries the learner's answer for
        server-side grading; NO answer key is on the device. evidence_id is the durable idempotency
        key (a client uuid7). No child PII — only the pseudonymous student_ref. Exactly one answer
        field by the item's kind (option | text | order | pairs); a missing, extra or mismatched
        field is a conflict.
      required: [student_ref, objective_code, item_ref, evidence_id]
      properties:
        student_ref: { type: string }
        objective_code: { type: string }
        item_ref: { type: string }
        option: { type: integer, description: "choose: the chosen option index" }
        text: { type: string, maxLength: 200, description: "fill: the typed answer" }
        order:
          type: array
          maxItems: 64
          items: { type: integer }
          description: "order: option indices in the learner's order"
        pairs:
          type: array
          maxItems: 64
          description: "match / sort: [left, right] option-index pairs"
          items: { type: array, minItems: 2, maxItems: 2, items: { type: integer } }
        evidence_id: { type: string, description: Client-generated uuid7 (durable idempotency key) }
        session_id: { type: string }
        hints_used: { type: integer, default: 0 }
        response_time_ms: { type: integer, default: 0 }
        self_confidence: { type: ["number", "null"] }
        context:
          type: string
          enum: [diagnose, practice, teach, review, revise, remediate]
          default: practice
        lesson_version:
          type: integer
          minimum: 1
          description: >-
            The published lesson version the device's package was built from (its manifest's
            `lesson_version`), recorded on the evidence. Absent, malformed, or sent with a
            `lesson_id` other than the lesson graded against: recorded as unknown (NULL), never
            replaced by the version published now.
        lesson_id: { type: string, description: "Optional: the package's lesson_id (see lesson_version)" }
    HomeworkPayload:
      type: object
      description: >-
        Shape of a homework.submitted delta's payload (OFFLINE_SYNC_SPEC §1a;
        HOMEWORK_AND_MARKING_CONTRACT §2). A written homework answer the child sent while offline,
        applied by the same school service as the online submit. No child PII beyond the
        pseudonymous student_ref and the child's own answer text. A malformed payload is a
        conflict with reason INVALID.
      required: [student_ref, source, item_ref, text, submission_key]
      properties:
        student_ref: { type: string, description: Must equal the token subject }
        source: { type: string, enum: [self_paced, assignment] }
        assignment_id: { type: string, description: "Required when source = assignment" }
        objective_code: { type: string, description: "Required when source = self_paced" }
        item_ref: { type: string }
        text:
          type: string
          description: >-
            The child's answer; trimmed and capped at the item's max_chars (200 short, 2000
            otherwise) exactly as online.
        submission_key:
          type: string
          maxLength: 64
          description: >-
            Client-generated uuid7 — the durable idempotency key (stored on the submission row).
            Falls back to clientEventId when absent.
        attempt:
          type: integer
          minimum: 1
          description: >-
            The attempt the child was making (the server's last attempt + 1). When the server
            already holds this attempt or a later one the delta is a conflict
            (SUBMISSION_SUPERSEDED); an older offline answer never overwrites a newer one.
        submitted_at:
          type: number
          description: Device clock (ms). Informational only; never used for ordering or stored.
    BatchIn:
      type: object
      properties:
        cursor: { type: integer, default: 0 }
        deltas:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/DeltaIn" }
    BatchResult:
      type: object
      properties:
        cursor: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              clientEventId: { type: string }
              status:
                type: string
                enum: [applied, duplicate, ignored, conflict]
              version: { type: integer }
              reason:
                type: string
                description: >-
                  Present when nothing was applied and the server names why. homework.submitted:
                  SUBMISSION_MARKED, SUBMISSION_SUPERSEDED, NOT_AVAILABLE, LESSON_ASSIGNED,
                  SHARING_REQUIRED, INVALID, BUSY, HOMEWORK_UNAVAILABLE.
              result:
                type: object
                additionalProperties: true
                description: >-
                  Present when the device must show the server's answer. homework.submitted
                  (applied / duplicate): the learner's submit view, the same body the online submit
                  returns (source, assignment_id, objective_code, item_ref, marking, state,
                  can_retry, submission, compare). Never a rubric or an answer key.
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
