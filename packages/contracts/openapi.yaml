openapi: 3.1.0
info:
  title: Project Taleem — Core API
  version: 0.1.0
  description: >-
    M1 walking skeleton. Contract-first (docs/10-api-design.md). Governance-safe endpoints only —
    no enrolment, child accounts, payments, production AI, or safeguarding workflows.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.taleem.dev
    description: Reference environment (placeholder; concrete host per FOUNDER_DECISIONS FD-02)
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: observability
    description: Metrics exposition for monitoring.
  - name: sync
    description: >-
      Offline sync (Phase 6.2B). attempt.submitted deltas durably record AssessmentEvidence
      (idempotent by client-generated evidence_id); progress / lesson.completed / preference keep
      the in-memory conflict policy (monotonic max / idempotent set / server-order-wins).
  - name: skeleton
    description: Authentication and authorization seam demonstration.
paths:
  /health:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness
      security: []
      responses:
        "200":
          description: Service is live
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness (dependency probes)
      security: []
      responses:
        "200": { description: Ready }
        "503":
          description: Degraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /metrics:
    get:
      tags: [observability]
      operationId: getMetrics
      summary: Prometheus metrics exposition
      security: []
      responses:
        "200":
          description: Metrics
          content:
            text/plain:
              schema: { type: string }
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/sync/batch:
    post:
      tags: [sync]
      operationId: postSyncBatch
      summary: Offline sync batch (idempotent; durable evidence for attempts)
      description: >-
        Applies client-generated deltas with the remediated conflict policy (docs/33 §6): idempotent
        on clientEventId, append-only by union, monotonic progress, server-version ordering (no
        client wall-clock). Phase 6.2B: an attempt.submitted delta is graded server-side against the
        published lesson and durably recorded as AssessmentEvidence via LearningUnitOfWork, keyed on
        a client-generated evidence_id so a replay (even after a server restart) is a DUPLICATE.
        A summative item is never auto-graded by sync (mentor-mediated). See AttemptPayload.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchIn"
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResult"
        "422":
          description: Validation / unknown delta type
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/skeleton/protected:
    get:
      tags: [skeleton]
      operationId: getProtected
      summary: AuthN(JWT) + AuthZ(PDP deny-by-default) seam demo
      security:
        - bearerAuth: []
      responses:
        "200": { description: Allowed }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: Forbidden (deny-by-default)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Readiness:
      type: object
      properties:
        status: { type: string, example: degraded }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: boolean }
    DeltaIn:
      type: object
      required: [clientEventId, type, entityKey]
      properties:
        clientEventId: { type: string, maxLength: 128 }
        type:
          type: string
          enum: [progress.updated, lesson.completed, attempt.submitted, preference.set]
        entityKey: { type: string, maxLength: 256 }
        payload: { type: object, additionalProperties: true }
        clientSeq: { type: integer, default: 0 }
    AttemptPayload:
      type: object
      description: >-
        Shape of an attempt.submitted delta's payload (Phase 6.2B). Carries the learner's answer for
        server-side grading; NO answer key is on the device. evidence_id is the durable idempotency
        key (a client uuid7). No child PII — only the pseudonymous student_ref.
      required: [student_ref, objective_code, item_ref, option, evidence_id]
      properties:
        student_ref: { type: string }
        objective_code: { type: string }
        item_ref: { type: string }
        option: { type: integer, description: Chosen option index }
        evidence_id: { type: string, description: Client-generated uuid7 (durable idempotency key) }
        session_id: { type: string }
        hints_used: { type: integer, default: 0 }
        response_time_ms: { type: integer, default: 0 }
        self_confidence: { type: ["number", "null"] }
        context:
          type: string
          enum: [diagnose, practice, teach, review, revise, remediate]
          default: practice
    BatchIn:
      type: object
      properties:
        cursor: { type: integer, default: 0 }
        deltas:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/DeltaIn" }
    BatchResult:
      type: object
      properties:
        cursor: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              clientEventId: { type: string }
              status:
                type: string
                enum: [applied, duplicate, ignored, conflict]
              version: { type: integer }
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
