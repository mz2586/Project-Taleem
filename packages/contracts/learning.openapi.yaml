openapi: 3.1.0
info:
  title: Project Taleem — Learning Intelligence Platform API
  version: 0.1.0
  description: >-
    Learning Intelligence Platform (Phase 4.1 vertical slice). Session orchestration + Student
    Knowledge Model over published curriculum. Governance-safe: synthetic/pseudonymous learners
    only in this phase; all child-facing use is gated on Phase-1.5 governance decisions.
  license:
    name: Proprietary — license undecided; see repository LICENSE
servers:
  - url: https://api.taleem.dev
    description: Reference environment (placeholder; concrete host per FOUNDER_DECISIONS FD-02)
tags:
  - name: learning
    description: Learning session lifecycle + student knowledge.
paths:
  /v1/learning/sessions:
    post:
      tags: [learning]
      operationId: startSession
      summary: Start a learning session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartSessionIn" } } }
      responses:
        "201": { description: Session started, content: { application/json: { schema: { $ref: "#/components/schemas/SessionView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/sessions/{sessionId}:next:
    post:
      tags: [learning]
      operationId: nextDecision
      summary: Ask the decision engine for the next action
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Decision, content: { application/json: { schema: { $ref: "#/components/schemas/DecisionView" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/sessions/{sessionId}:teach:
    post:
      tags: [learning]
      operationId: teach
      summary: Deliver the approved lesson for an objective (templated runtime)
      description: >-
        The objective is the decision engine's pick (after :next), or — with `learner_chosen` — a
        lesson the learner chose (a lesson row on the path, a unit-check remediation link). A
        learner-chosen lesson may be any published lesson visible to the learner's cohort
        (DEMO_COHORT_CONTRACT.md §3); an unknown, unpublished or other-cohort lesson is a 404. The
        session's rationale records the choice ("You chose this lesson") beside the engine's own
        recommendation, which never blocks it; unmet prerequisites come back as a
        `prerequisite_hint`, not a refusal. Choosing in the middle of a lesson is a 409.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TeachIn" } } }
      responses:
        "200": { description: Lesson delivery, content: { application/json: { schema: { $ref: "#/components/schemas/TeachView" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Session state conflict, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/sessions/{sessionId}:answer:
    post:
      tags: [learning]
      operationId: submitAnswer
      summary: Submit a learner answer (scored; updates the Student Model)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AnswerIn" } } }
      responses:
        "200": { description: Answer result, content: { application/json: { schema: { $ref: "#/components/schemas/AnswerView" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/sessions/{sessionId}:end:
    post:
      tags: [learning]
      operationId: endSession
      summary: End a session
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Session ended, content: { application/json: { schema: { $ref: "#/components/schemas/SessionEndView" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/knowledge:
    get:
      tags: [learning]
      operationId: getKnowledge
      summary: Student Knowledge Model summary (mastery per objective)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Knowledge, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeView" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/progress:
    get:
      tags: [learning]
      operationId: getProgress
      summary: Learning-analytics progress summary
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Progress summary, content: { application/json: { schema: { $ref: "#/components/schemas/ProgressView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/placement:
    get:
      tags: [learning]
      operationId: getPlacement
      summary: Diagnostic placement — state, the next question, or the seeded priors
      description: >-
        For a learner with no practice history. `unavailable` when no published lesson has a
        diagnostic item (an honest "no placement possible yet"). Rebuilt from the durable
        diagnostic evidence on every request; never includes an item's answer key.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Placement, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/placement:answer:
    post:
      tags: [learning]
      operationId: answerPlacement
      summary: Answer the placement's current question
      description: >-
        Records diagnostic evidence (context `diagnostic`, distinguishable from practice) and
        re-seeds the priors with provenance. A retried answer is not recounted (`duplicate: true`).
        409 PLACEMENT_ITEM_MISMATCH for any other item; 409 PLACEMENT_COMPLETE /
        PLACEMENT_UNAVAILABLE / PLACEMENT_NOT_ELIGIBLE when there is nothing to answer.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlacementAnswerIn" } } }
      responses:
        "200": { description: Placement after the answer, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementView" } } } }
        "409": { description: Not the current question / nothing to answer, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/path:
    get:
      tags: [learning]
      operationId: getLearningPath
      summary: The learner's path — subjects, units and lessons with states and the next step
      description: >-
        PROGRESSION_AND_EXAMINATION_CONTRACT §1. Derived from the stored hierarchy, the published
        lessons visible to the reader's cohort, evidence and the student model. `completed`
        (practice finished) and `demonstrated` (mastered) are distinct.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Path, content: { application/json: { schema: { $ref: "#/components/schemas/LearningPath" } } } }
        "403": { description: Not the learner, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/units/{unitKey}/checks:
    post:
      tags: [learning]
      operationId: startUnitCheck
      summary: Start a unit check (201), or resume the open sitting (200)
      description: >-
        Assembled on the server from the unit's published auto-scored items, balanced across its
        objectives, avoiding items seen in the last 7 days when the pool allows. Online only.
        409 UNIT_NOT_READY until every lesson is practised; 429 RETAKE_NOT_YET (with
        `retake_after`) until remediation on the missed objectives or 24 hours.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: studentRef, in: path, required: true, schema: { type: string } }
        - { name: unitKey, in: path, required: true, description: "The path's unit_key (e.g. math.u1)", schema: { type: string } }
      responses:
        "201": { description: Sitting started, content: { application/json: { schema: { $ref: "#/components/schemas/UnitCheckSitting" } } } }
        "200": { description: Open sitting resumed, content: { application/json: { schema: { $ref: "#/components/schemas/UnitCheckSitting" } } } }
        "403": { description: Not the learner, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: No such unit on the path, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Unit not ready, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { description: Retake not yet allowed, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/units/{unitKey}/checks/{sittingId}:
    get:
      tags: [learning]
      operationId: getUnitCheckSitting
      summary: Resume a sitting (its next unanswered item); a finished one returns its result
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: studentRef, in: path, required: true, schema: { type: string } }
        - { name: unitKey, in: path, required: true, description: "The path's unit_key (e.g. math.u1)", schema: { type: string } }
        - { name: sittingId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Sitting, content: { application/json: { schema: { $ref: "#/components/schemas/UnitCheckSitting" } } } }
        "410": { description: Sitting expired (incomplete), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/units/{unitKey}/checks/{sittingId}:answer:
    post:
      tags: [learning]
      operationId: answerUnitCheckItem
      summary: Answer one item (scored on the server; once per sitting, idempotent)
      description: >-
        The response never reveals whether the answer was right. A repeated answer to the same
        item changes nothing (`duplicate: true`). 422 when the answer does not fit the item kind.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: studentRef, in: path, required: true, schema: { type: string } }
        - { name: unitKey, in: path, required: true, description: "The path's unit_key (e.g. math.u1)", schema: { type: string } }
        - { name: sittingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UnitCheckAnswerIn" } } }
      responses:
        "200": { description: Answer accepted, content: { application/json: { schema: { $ref: "#/components/schemas/UnitCheckAnswerView" } } } }
        "410": { description: Sitting expired (incomplete), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: Answer does not fit the item, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/units/{unitKey}/checks/{sittingId}:finish:
    post:
      tags: [learning]
      operationId: finishUnitCheck
      summary: Score the sitting (every item answered); idempotent once finished
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: studentRef, in: path, required: true, schema: { type: string } }
        - { name: unitKey, in: path, required: true, description: "The path's unit_key (e.g. math.u1)", schema: { type: string } }
        - { name: sittingId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Result, content: { application/json: { schema: { $ref: "#/components/schemas/UnitCheckResult" } } } }
        "409": { description: Items unanswered, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "410": { description: Sitting expired (incomplete), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/record:
    get:
      tags: [learning]
      operationId: getAcademicRecord
      summary: The academic record — the learner themself, or a teacher of their own class
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Record, content: { application/json: { schema: { $ref: "#/components/schemas/AcademicRecord" } } } }
        "403": { description: Not permitted, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/guardian/children/{studentRef}/record:
    get:
      tags: [learning]
      operationId: getChildAcademicRecord
      summary: The academic record of the guardian's own child
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Record, content: { application/json: { schema: { $ref: "#/components/schemas/AcademicRecord" } } } }
        "403": { description: Not permitted, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified bearer JWT. A learner may only access their own data (IDOR-guarded).
  schemas:
    PlacementAnswerIn:
      type: object
      description: >-
        The current question plus exactly one answer field, by the item's kind (option for choose,
        text for fill, order for order, pairs for match / sort). A missing, extra or mismatched
        field is a 422.
      required: [item_ref]
      properties:
        item_ref: { type: string }
        option: { type: integer, minimum: 0, description: "choose: the chosen option index" }
        text: { type: string, maxLength: 200, description: "fill: the typed answer" }
        order:
          type: array
          maxItems: 64
          items: { type: integer }
          description: "order: option indices in the learner's order"
        pairs:
          type: array
          maxItems: 64
          description: "match / sort: [left, right] option-index pairs"
          items: { type: array, minItems: 2, maxItems: 2, items: { type: integer } }
        response_time_ms: { type: integer, minimum: 0 }
    PlacementObjective:
      type: object
      description: A seeded prior with its confidence and provenance.
      properties:
        objective_code: { type: string }
        status: { type: string, enum: [secure, not_yet, uncertain] }
        prior: { type: number }
        uncertainty: { type: number }
        correct: { type: integer, description: Direct diagnostic answers right on this objective }
        incorrect: { type: integer }
        inferred_from:
          type: ["string", "null"]
          description: Set when this objective was not asked but implied by a secure one above it.
        item_refs: { type: array, items: { type: string } }
        source: { type: string, enum: [diagnostic] }
        recorded_at: { type: number }
    PlacementView:
      type: object
      properties:
        student_ref: { type: string }
        status: { type: string, enum: [unavailable, not_eligible, available, in_progress, completed] }
        reason: { type: ["string", "null"], enum: [no_published_items, has_history, null] }
        placement_id: { type: ["string", "null"] }
        items_used: { type: integer }
        max_items: { type: integer }
        stop_reason: { type: ["string", "null"], enum: [max_items, frontier_resolved, items_exhausted, null] }
        placement_uncertainty: { type: number }
        stop_uncertainty: { type: number }
        chain_from_sequence:
          type: boolean
          description: True when the curriculum declares no prerequisites and its order is used as the chain.
        start_objective: { type: ["string", "null"] }
        duplicate: { type: boolean }
        next_item:
          type: ["object", "null"]
          properties:
            item_ref: { type: string }
            objective_code: { type: string }
            kind:
              type: string
              enum: [choose, fill, order, match, sort, written]
              description: Interaction kind (ITEM_INTERACTION_CONTRACT.md); how to show + answer the item.
            left_count:
              type: integer
              minimum: 0
              description: "match / sort: options[:left_count] are the left items (cards); 0 otherwise."
            prompt: { type: object, additionalProperties: { type: string } }
            options: { type: array, items: { type: string } }
        objectives:
          type: array
          items: { $ref: "#/components/schemas/PlacementObjective" }
    StartSessionIn:
      type: object
      required: [student_ref]
      properties:
        student_ref: { type: string }
    TeachIn:
      type: object
      required: [objective_code]
      properties:
        objective_code: { type: string }
        learner_chosen:
          type: boolean
          default: false
          description: True when the learner chose this lesson rather than the decision engine.
    LearnerChoice:
      type: object
      description: A learner-chosen lesson, honestly explained.
      required: [objective_code, chosen_by, rationale, reasons, recommended, prerequisite_hint]
      properties:
        objective_code: { type: string }
        chosen_by: { type: string, enum: [learner] }
        rationale:
          type: array
          items: { type: string }
          description: The engine's English trace; starts with "You chose this lesson".
        reasons:
          type: array
          description: Structured reasons (`prerequisite_gap` per unmet prerequisite).
          items:
            type: object
            properties:
              code: { type: string }
              params: { type: object, additionalProperties: { type: ["string", "number"] } }
        recommended:
          type: object
          description: What the AI teacher would have picked (advisory; it never blocks a choice).
          properties:
            decision:
              type: string
              enum: [diagnose, teach, continue, review, remediate, advance, revise, escalate, rest, complete]
            objective_code: { type: ["string", "null"] }
        prerequisite_hint:
          description: Prerequisites not yet met (neither mastered nor placed secure); null when none.
          oneOf:
            - type: "null"
            - type: object
              required: [unmet]
              properties:
                unmet:
                  type: array
                  items:
                    type: object
                    required: [objective_code, title]
                    properties:
                      objective_code: { type: string }
                      title:
                        description: The title of the lesson teaching it ({ur, en}); null when none is visible.
                        oneOf:
                          - type: "null"
                          - { type: object, additionalProperties: { type: string } }
    AnswerIn:
      type: object
      description: >-
        Exactly one answer field, by the item's kind (option for choose, text for fill, order for
        order, pairs for match / sort). A missing, extra or mismatched field is a 422.
      required: [objective_code, item_ref]
      properties:
        objective_code: { type: string }
        item_ref: { type: string }
        option: { type: integer, description: "choose: the chosen option index" }
        text: { type: string, maxLength: 200, description: "fill: the typed answer" }
        order:
          type: array
          maxItems: 64
          items: { type: integer }
          description: "order: option indices in the learner's order"
        pairs:
          type: array
          maxItems: 64
          description: "match / sort: [left, right] option-index pairs"
          items: { type: array, minItems: 2, maxItems: 2, items: { type: integer } }
        hints_used: { type: integer, default: 0 }
        self_confidence: { type: ["number", "null"] }
    SessionView:
      type: object
      properties:
        session_id: { type: string }
        state: { type: string }
    DecisionView:
      type: object
      properties:
        decision:
          type: string
          enum: [diagnose, teach, continue, review, remediate, advance, revise, escalate, rest, complete]
        objective_code: { type: ["string", "null"] }
        rationale: { type: array, items: { type: string } }
    TeachView:
      type: object
      properties:
        chosen_by:
          type: string
          enum: [engine, learner]
          description: Who chose this lesson — the decision engine, or the learner.
        choice:
          description: Set when the learner chose the lesson (`learner_chosen`); null otherwise.
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/LearnerChoice" }
        utterances:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              text: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              item_ref: { type: string }
              kind:
                type: string
                enum: [choose, fill, order, match, sort, written]
                description: Interaction kind (ITEM_INTERACTION_CONTRACT.md); how to show + answer the item.
              left_count:
                type: integer
                minimum: 0
                description: "match / sort: options[:left_count] are the left items (cards); 0 otherwise."
              prompt: { type: object, additionalProperties: { type: string } }
              options: { type: array, items: { type: string } }
              hint_count:
                type: integer
                minimum: 0
                description: Number of authored graduated hints available via the :hint operation.
    AnswerView:
      type: object
      properties:
        outcome: { type: string, enum: [correct, incorrect, partial] }
        mastery: { type: number }
        state: { type: string }
        post_decision: { type: string }
        confirmed_misconceptions: { type: array, items: { type: string } }
        cleared_misconceptions: { type: array, items: { type: string } }
        feedback: { type: array, items: { type: string } }
    SessionEndView:
      type: object
      properties:
        state: { type: string }
        interactions: { type: integer }
    KnowledgeView:
      type: object
      properties:
        student_ref: { type: string }
        objectives:
          type: object
          additionalProperties:
            type: object
            properties:
              mastery: { type: number }
              uncertainty: { type: number }
              state: { type: string }
    ProgressView:
      type: object
      properties:
        student_ref: { type: string }
        objectives_mastered: { type: integer }
        objectives_in_progress: { type: integer }
        total_attempts: { type: integer }
        accuracy: { type: number }
        misconceptions_detected: { type: integer }
        misconceptions_cleared: { type: integer }
        reviews_scheduled: { type: integer }
        events_by_type: { type: object, additionalProperties: { type: integer } }
        objective_mastery: { type: object, additionalProperties: { type: number } }
    Bilingual:
      type: object
      additionalProperties: { type: string }
      description: "Localized text by locale tag ({ur, en})."
    UnitCheckItem:
      type: object
      description: An item as the learner sees it — display fields only; never an answer key or hints.
      properties:
        item_ref: { type: string }
        kind: { type: string, enum: [choose, fill, order, match, sort] }
        prompt: { $ref: "#/components/schemas/Bilingual" }
        options: { type: array, items: { type: string } }
        left_count: { type: integer, minimum: 0 }
        position: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 1 }
    PathLesson:
      type: object
      properties:
        lesson_id: { type: string }
        objective_code: { type: string }
        title: { $ref: "#/components/schemas/Bilingual" }
        state: { type: string, enum: [not_started, in_progress, practised, mastered] }
        completed: { type: boolean, description: Practice finished }
        demonstrated: { type: boolean, description: Every objective mastered in the student model }
    PathUnitCheck:
      type: object
      properties:
        available: { type: boolean }
        best_score: { type: ["number", "null"] }
        passed: { type: boolean }
        last_sitting_id: { type: ["string", "null"] }
        open_sitting_id: { type: ["string", "null"] }
        can_retake: { type: boolean }
        retake_after: { type: ["number", "null"] }
        item_count: { type: integer }
        pass_mark: { type: integer }
    PathUnit:
      type: object
      properties:
        unit_key: { type: string }
        unit_id: { type: string }
        title: { $ref: "#/components/schemas/Bilingual" }
        state: { type: string, enum: [not_started, in_progress, ready_for_check, completed] }
        lessons: { type: array, items: { $ref: "#/components/schemas/PathLesson" } }
        check: { $ref: "#/components/schemas/PathUnitCheck" }
    NextStep:
      type: ["object", "null"]
      properties:
        kind: { type: string, enum: [lesson, unit_check] }
        unit_key: { type: string }
        title: { $ref: "#/components/schemas/Bilingual" }
        lesson_id: { type: string }
        objective_code: { type: string }
        sitting_id: { type: ["string", "null"] }
        reason: { type: string, enum: [practice, remediation] }
    LearningPath:
      type: object
      properties:
        student_ref: { type: string }
        grade: { type: ["integer", "string"], description: The enrolment grade level (KG is 0) }
        grade_key: { type: string }
        grade_state: { type: string, enum: [not_started, in_progress, completed] }
        label: { type: string, description: "Always \"Taleem unit check\"" }
        notice: { type: string }
        online_only: { type: boolean }
        subjects:
          type: array
          items:
            type: object
            properties:
              subject_key: { type: string }
              title: { $ref: "#/components/schemas/Bilingual" }
              units: { type: array, items: { $ref: "#/components/schemas/PathUnit" } }
        next_step: { $ref: "#/components/schemas/NextStep" }
        derived_at: { type: number }
    UnitCheckSitting:
      type: object
      properties:
        sitting_id: { type: string }
        unit_key: { type: string }
        unit_title: { $ref: "#/components/schemas/Bilingual" }
        label: { type: string }
        status: { type: string, enum: [in_progress, passed, failed, incomplete] }
        started_at: { type: number }
        expires_at: { type: number }
        total: { type: integer }
        answered: { type: integer }
        resumed: { type: boolean }
        item:
          oneOf:
            - { $ref: "#/components/schemas/UnitCheckItem" }
            - { type: "null" }
    UnitCheckAnswerIn:
      type: object
      description: The item plus exactly one answer field, by the item's kind.
      required: [item_ref]
      properties:
        item_ref: { type: string }
        option: { type: integer }
        text: { type: string, maxLength: 200 }
        order: { type: array, maxItems: 64, items: { type: integer } }
        pairs:
          type: array
          maxItems: 64
          items: { type: array, minItems: 2, maxItems: 2, items: { type: integer } }
        response_time_ms: { type: integer, minimum: 0 }
    UnitCheckAnswerView:
      type: object
      properties:
        sitting_id: { type: string }
        accepted: { type: boolean }
        duplicate: { type: boolean }
        answered: { type: integer }
        total: { type: integer }
        next_item:
          oneOf:
            - { $ref: "#/components/schemas/UnitCheckItem" }
            - { type: "null" }
    ObjectiveScore:
      type: object
      properties:
        objective_code: { type: string }
        title: { $ref: "#/components/schemas/Bilingual" }
        correct: { type: integer }
        total: { type: integer }
        percent: { type: number }
        met: { type: boolean }
    UnitCheckResult:
      type: object
      properties:
        sitting_id: { type: string }
        unit_key: { type: string }
        label: { type: string }
        status: { type: string, enum: [passed, failed] }
        finished_at: { type: number }
        score_percent: { type: number }
        passed: { type: boolean }
        pass_mark: { type: integer }
        correct: { type: integer }
        total: { type: integer }
        per_objective: { type: array, items: { $ref: "#/components/schemas/ObjectiveScore" } }
        misconceptions: { type: array, items: { type: string } }
        remediation:
          type: array
          items:
            type: object
            properties:
              objective_code: { type: string }
              title: { $ref: "#/components/schemas/Bilingual" }
              lesson_id: { type: ["string", "null"] }
        can_retake: { type: boolean }
        retake_after: { type: ["number", "null"] }
    AcademicRecord:
      type: object
      description: Every figure derives from stored sittings and evidence. Unit checks are not certification.
      properties:
        student_ref: { type: string }
        grade: { type: ["integer", "string"] }
        grade_key: { type: string }
        grade_state: { type: string, enum: [not_started, in_progress, completed] }
        grade_completion:
          type: ["object", "null"]
          properties:
            grade: { type: ["integer", "string"] }
            grade_key: { type: string }
            completed_at: { type: number }
            accredited: { type: boolean, enum: [false] }
            label: { $ref: "#/components/schemas/Bilingual" }
        subjects:
          type: array
          items:
            type: object
            properties:
              subject_key: { type: string }
              title: { $ref: "#/components/schemas/Bilingual" }
              units:
                type: array
                items:
                  type: object
                  properties:
                    unit_key: { type: string }
                    title: { $ref: "#/components/schemas/Bilingual" }
                    state: { type: string, enum: [not_started, in_progress, ready_for_check, completed] }
                    best_score: { type: ["number", "null"] }
                    sittings: { type: array, items: { type: string } }
        sittings:
          type: array
          items:
            type: object
            properties:
              sitting_id: { type: string }
              unit_key: { type: string }
              unit_title: { $ref: "#/components/schemas/Bilingual" }
              started_at: { type: number }
              finished_at: { type: ["number", "null"] }
              state: { type: string, enum: [finished, incomplete] }
              score_percent: { type: ["number", "null"] }
              passed: { type: ["boolean", "null"] }
              pass_mark: { type: integer }
              per_objective: { type: array, items: { $ref: "#/components/schemas/ObjectiveScore" } }
        lessons_mastered:
          type: array
          items:
            type: object
            properties:
              objective_code: { type: string }
              title: { $ref: "#/components/schemas/Bilingual" }
              lesson_id: { type: string }
        report_cards:
          type: array
          items:
            type: object
            properties:
              card_id: { type: string }
              period_start: { type: number }
              period_end: { type: number }
              issued_at: { type: number }
              href: { type: string }
        notice: { type: string }
        derived_at: { type: number }
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        retake_after: { type: ["number", "null"], description: "RETAKE_NOT_YET: when a retake opens without remediation" }
        remediation_due: { type: array, items: { type: string }, description: "RETAKE_NOT_YET: objectives still to remediate" }
