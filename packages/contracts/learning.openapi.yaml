openapi: 3.1.0
info:
  title: Project Taleem — Learning Intelligence Platform API
  version: 0.1.0
  description: >-
    Learning Intelligence Platform (Phase 4.1 vertical slice). Session orchestration + Student
    Knowledge Model over published curriculum. Governance-safe: synthetic/pseudonymous learners
    only in this phase; all child-facing use is gated on Phase-1.5 governance decisions.
  license:
    name: Proprietary — license undecided; see repository LICENSE
servers:
  - url: https://api.taleem.dev
    description: Reference environment (placeholder; concrete host per FOUNDER_DECISIONS FD-02)
tags:
  - name: learning
    description: Learning session lifecycle + student knowledge.
paths:
  /v1/learning/sessions:
    post:
      tags: [learning]
      operationId: startSession
      summary: Start a learning session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartSessionIn" } } }
      responses:
        "201": { description: Session started, content: { application/json: { schema: { $ref: "#/components/schemas/SessionView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/sessions/{sessionId}:next:
    post:
      tags: [learning]
      operationId: nextDecision
      summary: Ask the decision engine for the next action
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Decision, content: { application/json: { schema: { $ref: "#/components/schemas/DecisionView" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/sessions/{sessionId}:teach:
    post:
      tags: [learning]
      operationId: teach
      summary: Deliver the approved lesson for an objective (templated runtime)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TeachIn" } } }
      responses:
        "200": { description: Lesson delivery, content: { application/json: { schema: { $ref: "#/components/schemas/TeachView" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/sessions/{sessionId}:answer:
    post:
      tags: [learning]
      operationId: submitAnswer
      summary: Submit a learner answer (scored; updates the Student Model)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AnswerIn" } } }
      responses:
        "200": { description: Answer result, content: { application/json: { schema: { $ref: "#/components/schemas/AnswerView" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/sessions/{sessionId}:end:
    post:
      tags: [learning]
      operationId: endSession
      summary: End a session
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Session ended, content: { application/json: { schema: { $ref: "#/components/schemas/SessionEndView" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/knowledge:
    get:
      tags: [learning]
      operationId: getKnowledge
      summary: Student Knowledge Model summary (mastery per objective)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Knowledge, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeView" } } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/progress:
    get:
      tags: [learning]
      operationId: getProgress
      summary: Learning-analytics progress summary
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Progress summary, content: { application/json: { schema: { $ref: "#/components/schemas/ProgressView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/placement:
    get:
      tags: [learning]
      operationId: getPlacement
      summary: Diagnostic placement — state, the next question, or the seeded priors
      description: >-
        For a learner with no practice history. `unavailable` when no published lesson has a
        diagnostic item (an honest "no placement possible yet"). Rebuilt from the durable
        diagnostic evidence on every request; never includes an item's answer key.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Placement, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementView" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/learning/students/{studentRef}/placement:answer:
    post:
      tags: [learning]
      operationId: answerPlacement
      summary: Answer the placement's current question
      description: >-
        Records diagnostic evidence (context `diagnostic`, distinguishable from practice) and
        re-seeds the priors with provenance. A retried answer is not recounted (`duplicate: true`).
        409 PLACEMENT_ITEM_MISMATCH for any other item; 409 PLACEMENT_COMPLETE /
        PLACEMENT_UNAVAILABLE / PLACEMENT_NOT_ELIGIBLE when there is nothing to answer.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: studentRef, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlacementAnswerIn" } } }
      responses:
        "200": { description: Placement after the answer, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementView" } } } }
        "409": { description: Not the current question / nothing to answer, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified bearer JWT. A learner may only access their own data (IDOR-guarded).
  schemas:
    PlacementAnswerIn:
      type: object
      description: >-
        The current question plus exactly one answer field, by the item's kind (option for choose,
        text for fill, order for order, pairs for match / sort). A missing, extra or mismatched
        field is a 422.
      required: [item_ref]
      properties:
        item_ref: { type: string }
        option: { type: integer, minimum: 0, description: "choose: the chosen option index" }
        text: { type: string, maxLength: 200, description: "fill: the typed answer" }
        order:
          type: array
          maxItems: 64
          items: { type: integer }
          description: "order: option indices in the learner's order"
        pairs:
          type: array
          maxItems: 64
          description: "match / sort: [left, right] option-index pairs"
          items: { type: array, minItems: 2, maxItems: 2, items: { type: integer } }
        response_time_ms: { type: integer, minimum: 0 }
    PlacementObjective:
      type: object
      description: A seeded prior with its confidence and provenance.
      properties:
        objective_code: { type: string }
        status: { type: string, enum: [secure, not_yet, uncertain] }
        prior: { type: number }
        uncertainty: { type: number }
        correct: { type: integer, description: Direct diagnostic answers right on this objective }
        incorrect: { type: integer }
        inferred_from:
          type: ["string", "null"]
          description: Set when this objective was not asked but implied by a secure one above it.
        item_refs: { type: array, items: { type: string } }
        source: { type: string, enum: [diagnostic] }
        recorded_at: { type: number }
    PlacementView:
      type: object
      properties:
        student_ref: { type: string }
        status: { type: string, enum: [unavailable, not_eligible, available, in_progress, completed] }
        reason: { type: ["string", "null"], enum: [no_published_items, has_history, null] }
        placement_id: { type: ["string", "null"] }
        items_used: { type: integer }
        max_items: { type: integer }
        stop_reason: { type: ["string", "null"], enum: [max_items, frontier_resolved, items_exhausted, null] }
        placement_uncertainty: { type: number }
        stop_uncertainty: { type: number }
        chain_from_sequence:
          type: boolean
          description: True when the curriculum declares no prerequisites and its order is used as the chain.
        start_objective: { type: ["string", "null"] }
        duplicate: { type: boolean }
        next_item:
          type: ["object", "null"]
          properties:
            item_ref: { type: string }
            objective_code: { type: string }
            kind:
              type: string
              enum: [choose, fill, order, match, sort, written]
              description: Interaction kind (ITEM_INTERACTION_CONTRACT.md); how to show + answer the item.
            left_count:
              type: integer
              minimum: 0
              description: "match / sort: options[:left_count] are the left items (cards); 0 otherwise."
            prompt: { type: object, additionalProperties: { type: string } }
            options: { type: array, items: { type: string } }
        objectives:
          type: array
          items: { $ref: "#/components/schemas/PlacementObjective" }
    StartSessionIn:
      type: object
      required: [student_ref]
      properties:
        student_ref: { type: string }
    TeachIn:
      type: object
      required: [objective_code]
      properties:
        objective_code: { type: string }
    AnswerIn:
      type: object
      description: >-
        Exactly one answer field, by the item's kind (option for choose, text for fill, order for
        order, pairs for match / sort). A missing, extra or mismatched field is a 422.
      required: [objective_code, item_ref]
      properties:
        objective_code: { type: string }
        item_ref: { type: string }
        option: { type: integer, description: "choose: the chosen option index" }
        text: { type: string, maxLength: 200, description: "fill: the typed answer" }
        order:
          type: array
          maxItems: 64
          items: { type: integer }
          description: "order: option indices in the learner's order"
        pairs:
          type: array
          maxItems: 64
          description: "match / sort: [left, right] option-index pairs"
          items: { type: array, minItems: 2, maxItems: 2, items: { type: integer } }
        hints_used: { type: integer, default: 0 }
        self_confidence: { type: ["number", "null"] }
    SessionView:
      type: object
      properties:
        session_id: { type: string }
        state: { type: string }
    DecisionView:
      type: object
      properties:
        decision:
          type: string
          enum: [diagnose, teach, continue, review, remediate, advance, revise, escalate, rest, complete]
        objective_code: { type: ["string", "null"] }
        rationale: { type: array, items: { type: string } }
    TeachView:
      type: object
      properties:
        utterances:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              text: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              item_ref: { type: string }
              kind:
                type: string
                enum: [choose, fill, order, match, sort, written]
                description: Interaction kind (ITEM_INTERACTION_CONTRACT.md); how to show + answer the item.
              left_count:
                type: integer
                minimum: 0
                description: "match / sort: options[:left_count] are the left items (cards); 0 otherwise."
              prompt: { type: object, additionalProperties: { type: string } }
              options: { type: array, items: { type: string } }
              hint_count:
                type: integer
                minimum: 0
                description: Number of authored graduated hints available via the :hint operation.
    AnswerView:
      type: object
      properties:
        outcome: { type: string, enum: [correct, incorrect, partial] }
        mastery: { type: number }
        state: { type: string }
        post_decision: { type: string }
        confirmed_misconceptions: { type: array, items: { type: string } }
        cleared_misconceptions: { type: array, items: { type: string } }
        feedback: { type: array, items: { type: string } }
    SessionEndView:
      type: object
      properties:
        state: { type: string }
        interactions: { type: integer }
    KnowledgeView:
      type: object
      properties:
        student_ref: { type: string }
        objectives:
          type: object
          additionalProperties:
            type: object
            properties:
              mastery: { type: number }
              uncertainty: { type: number }
              state: { type: string }
    ProgressView:
      type: object
      properties:
        student_ref: { type: string }
        objectives_mastered: { type: integer }
        objectives_in_progress: { type: integer }
        total_attempts: { type: integer }
        accuracy: { type: number }
        misconceptions_detected: { type: integer }
        misconceptions_cleared: { type: integer }
        reviews_scheduled: { type: integer }
        events_by_type: { type: object, additionalProperties: { type: integer } }
        objective_mastery: { type: object, additionalProperties: { type: number } }
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
