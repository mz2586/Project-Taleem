openapi: 3.1.0
info:
  title: Project Taleem — Offline Package API
  version: 0.1.0
  description: >-
    Offline lesson packages (Phase 6.2A). Serves content-hashed packages the PWA caches to render
    lessons offline. Content is published curriculum (C0 — no child data), derived on the fly from
    the curriculum read model; no new tables. Two safety/versioning properties: packages ship the
    teaching + attempt surface but NO answer keys (correct_option / option_misconceptions are never
    sent to the device — grading stays server-side), and content_hash / version change iff content
    changes (automatic cache versioning + invalidation). No Ed25519 signing yet (that is 6.2C).
    Authenticated (bearer JWT), authorized to read learning.knowledge. Not IDOR-scoped: curriculum
    is not per-child data.
  license:
    name: Proprietary — license undecided; see repository LICENSE
servers:
  - url: https://api.taleem.dev
    description: Reference environment (placeholder; concrete host per FOUNDER_DECISIONS FD-02)
tags:
  - name: offline
    description: Offline lesson packages (content-hashed; no child data).
paths:
  /v1/offline/packages:
    get:
      tags: [offline]
      operationId: listOfflinePackages
      summary: Index of available offline packages (manifests only)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Package index
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageIndex" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/offline/signing-keys:
    get:
      tags: [offline]
      operationId: getOfflineSigningKeys
      summary: Public Ed25519 signing keys a client pins to verify package signatures
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Signing keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKeyList" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/offline/packages/{lessonId}:
    get:
      tags: [offline]
      operationId: getOfflinePackage
      summary: Full offline package (manifest + child-safe content) for one lesson
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Package
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfflinePackage" }
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No published package for this lesson
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default:
          description: Error
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified bearer JWT. Any actor with read learning.knowledge may fetch packages.
  schemas:
    PackageIndex:
      type: object
      properties:
        packages:
          type: array
          items: { $ref: "#/components/schemas/PackageManifest" }
    PackageAsset:
      type: object
      properties:
        ref: { type: string }
        kind: { type: string, description: "e.g. content" }
        sha256: { type: string }
        bytes: { type: integer }
    PackageManifest:
      type: object
      description: Verifiable descriptor (no child data). version = content_hash prefix.
      properties:
        package_id: { type: string, description: "Stable pointer, e.g. pkg/math-g4-intro-fractions" }
        lesson_id: { type: string }
        lesson_version:
          type: ["integer", "null"]
          description: >-
            The lesson's published version number this package was built from. Not signed (the
            signed `version` pins the content). Send it back as an attempt.submitted payload's
            `lesson_version` so the evidence records the version the work was done on.
        objective_code: { type: string }
        title:
          type: object
          additionalProperties: { type: string }
          description: >-
            The lesson's title by locale (`ur`, `en`), so a library names a lesson before it is
            downloaded. Not signed and not part of `content_hash`; the installed content carries
            the same title inside the signed, hashed content.
        version: { type: string, description: "Short content_hash prefix; changes iff content changes" }
        content_hash: { type: string, description: "SHA-256 hex over the canonical offline content" }
        assets:
          type: array
          items: { $ref: "#/components/schemas/PackageAsset" }
        total_bytes: { type: integer }
        created_at_ms: { type: integer }
        signature:
          type: string
          description: >-
            Hex Ed25519 signature over `${package_id}\n${version}\n${content_hash}` (6.2C-1). Empty
            when unsigned (backward-compatible). The private seed never leaves the server.
        signing_key_id:
          type: string
          description: Id of the key that produced `signature` (empty when unsigned).
    SigningKey:
      type: object
      properties:
        key_id: { type: string }
        algorithm: { type: string, description: '"Ed25519"' }
        public_key_hex: { type: string, description: "32-byte raw public key, hex (not secret)" }
    SigningKeyList:
      type: object
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/SigningKey" }
    OfflineItem:
      type: object
      description: Child-safe item — kind, prompt, options, left_count, authored hints. NO answer key.
      properties:
        item_ref: { type: string }
        objective_code: { type: string }
        kind:
          type: string
          enum: [choose, fill, order, match, sort, written]
          description: Interaction kind (ITEM_INTERACTION_CONTRACT.md); how to show + answer the item.
        left_count:
          type: integer
          minimum: 0
          description: "match / sort: options[:left_count] are the left items (cards); 0 otherwise."
        max_chars:
          type: integer
          description: >-
            Written items only (HOMEWORK_AND_MARKING_CONTRACT.md): the answer's length cap. A
            written item is answered online through the school homework API, never offline.
        prompt:
          type: object
          additionalProperties: { type: string }
          description: Locale map (ur / en).
        options:
          type: array
          items: { type: string }
        hints:
          type: array
          items: { type: string }
    OfflineContent:
      type: object
      description: >-
        The renderable lesson document. No answer key (correct_option, accepted_answers,
        correct_order, correct_pairs, option_misconceptions, misconception).
      properties:
        lesson_id: { type: string }
        objective_code: { type: string }
        title:
          type: object
          additionalProperties: { type: string }
        explanation:
          type: object
          additionalProperties: { type: string }
        worked_example_steps:
          type: array
          items: { type: string }
        practice_items:
          type: array
          items: { $ref: "#/components/schemas/OfflineItem" }
        homework_items:
          type: array
          items: { $ref: "#/components/schemas/OfflineItem" }
        assessment_formative:
          type: array
          items: { $ref: "#/components/schemas/OfflineItem" }
        summative_mentor_mediated: { type: boolean }
    OfflinePackage:
      type: object
      properties:
        manifest: { $ref: "#/components/schemas/PackageManifest" }
        content: { $ref: "#/components/schemas/OfflineContent" }
    Problem:
      type: object
      description: RFC 9457 problem+json.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
