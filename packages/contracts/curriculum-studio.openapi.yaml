openapi: 3.1.0
info:
  title: Project Taleem — Curriculum Studio API
  version: 0.1.0
  description: >-
    Curriculum Studio authoring platform (Phase 3). Governance-safe: internal authoring/review/
    versioning/publishing of original, NCP-aligned curriculum. No child data, no production content.
  license:
    name: Proprietary — license undecided; see repository LICENSE
servers:
  - url: https://api.taleem.dev
    description: Reference environment (placeholder; concrete host per FOUNDER_DECISIONS FD-02)
tags:
  - name: curriculum-studio
    description: Lesson authoring lifecycle (draft → review → publish → version).
paths:
  /v1/studio/hierarchy:
    get:
      tags: [curriculum-studio]
      operationId: getHierarchy
      summary: A curriculum pack's hierarchy; the persisted tree when stored, else the pack roster
      description: >-
        Returns the hierarchy persisted for the pack (Grade → Subject → Chapter → Topic,
        `source: persisted`) when one has been stored; otherwise the pack registry's grade ×
        subject roster with an empty `tree` (`source: pack`). Defaults to PK-NCP.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: pack
          in: query
          required: false
          description: Curriculum pack id (default PK-NCP).
          schema: { type: string, default: PK-NCP, minLength: 1, maxLength: 64 }
      responses:
        "200": { description: Hierarchy, content: { application/json: { schema: { $ref: "#/components/schemas/Hierarchy" } } } }
        "404": { description: Unknown curriculum pack, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { description: Rate limited, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/studio/curriculum-packs:
    get:
      tags: [curriculum-studio]
      operationId: listCurriculumPacks
      summary: List the curriculum packs lessons can be authored against (read-only)
      description: >-
        A pack describes a curriculum region / education system and the instructional locales it
        supports, independent of any interface language. Listing a pack is not a claim that its
        curriculum is supported for learners.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Packs, content: { application/json: { schema: { $ref: "#/components/schemas/CurriculumPackList" } } } }
        "429": { description: Rate limited, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/studio/lessons:
    get:
      tags: [curriculum-studio]
      operationId: listLessons
      summary: List lessons
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Lessons }
        "429": { description: Rate limited, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    post:
      tags: [curriculum-studio]
      operationId: createLesson
      summary: Create a draft lesson
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LessonDraftIn" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/LessonView" } } } }
        "422": { description: Rule violation, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Concurrent modification (optimistic-lock conflict; retry), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/studio/lessons/{lessonId}:
    get:
      tags: [curriculum-studio]
      operationId: getLesson
      summary: Read a lesson (content; answer keys only for reviewer and architect roles)
      description: >-
        Returns the lesson's full content. Assessment-item answer keys (`answer_key`,
        `accepted_variants`, `auto_marking_guidance`) are included only on this route and only for
        the review-stage roles and `curriculum_architect` (`answer_keys_included: true`). The
        `ETag` header (also `etag` in the body) is the If-Match precondition for PATCH.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Lesson
          headers:
            ETag: { description: Strong ETag of the lesson content, schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/LessonView" } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    patch:
      tags: [curriculum-studio]
      operationId: updateDraftLesson
      summary: Edit a draft lesson (author role; draft state only; If-Match required)
      description: >-
        Partial update; omitted fields are unchanged. Localized fields are `{locale: text}` maps
        merged per locale (an empty string removes that locale); every locale must belong to the
        lesson's curriculum pack. Optimistic locking: `If-Match` must carry the current ETag.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LessonPatchIn" } } } }
      responses:
        "200":
          description: Updated (answer keys never included)
          headers:
            ETag: { description: The new ETag, schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/LessonView" } } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Concurrent modification (optimistic-lock conflict; retry), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "412": { description: If-Match does not match the current ETag (reload and retry), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { description: "Not a draft; invalid locale, placement or field", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: If-Match header missing, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/studio/lessons/{lessonId}:validate:
    post:
      tags: [curriculum-studio]
      operationId: validateLesson
      summary: Run structural + provenance + automated quality-gate pre-checks
      security: [{ bearerAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Validation result, content: { application/json: { schema: { $ref: "#/components/schemas/ValidationResult" } } } }
        "422": { description: Rule violation, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Concurrent modification (optimistic-lock conflict; retry), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/studio/lessons/{lessonId}:submit:
    post:
      tags: [curriculum-studio]
      operationId: submitLesson
      summary: Submit for review (requires automated validation to pass)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ActorIn" } } } }
      responses:
        "200": { description: Submitted, content: { application/json: { schema: { $ref: "#/components/schemas/LessonView" } } } }
        "422": { description: Rule violation, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Concurrent modification (optimistic-lock conflict; retry), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/studio/lessons/{lessonId}:review:
    post:
      tags: [curriculum-studio]
      operationId: reviewLesson
      summary: Record a review decision (approve / request_changes) — no self-approval
      security: [{ bearerAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewIn" } } } }
      responses:
        "200": { description: Reviewed, content: { application/json: { schema: { $ref: "#/components/schemas/LessonView" } } } }
        "422": { description: Rule violation, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Concurrent modification (optimistic-lock conflict; retry), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/studio/lessons/{lessonId}:publish:
    post:
      tags: [curriculum-studio]
      operationId: publishLesson
      summary: Publish (approved + all 9 gates green) → new immutable version
      security: [{ bearerAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PublishIn" } } } }
      responses:
        "200": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/LessonView" } } } }
        "422": { description: Rule violation, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Concurrent modification (optimistic-lock conflict; retry), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/studio/lessons/{lessonId}:rollback:
    post:
      tags: [curriculum-studio]
      operationId: rollbackLesson
      summary: Roll back to a prior version
      security: [{ bearerAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RollbackIn" } } } }
      responses:
        "200": { description: Rolled back, content: { application/json: { schema: { $ref: "#/components/schemas/LessonView" } } } }
        "422": { description: Rule violation, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: Concurrent modification (optimistic-lock conflict; retry), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/studio/lessons/{lessonId}/versions:
    get:
      tags: [curriculum-studio]
      operationId: getVersions
      summary: Version history + content hashes
      security: [{ bearerAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: array, items: { $ref: "#/components/schemas/VersionView" } }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/studio/lessons/{lessonId}/versions/{version}:
    get:
      tags: [curriculum-studio]
      operationId: getVersion
      summary: One published version with its lesson body (for diffing)
      description: >-
        `body` is the lesson as published at that version. Same answer-key rule as getLesson.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Version with body
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/VersionView" }
                  - type: object
                    properties:
                      body: { type: object, additionalProperties: true }
                      answer_keys_included: { type: boolean }
        "404": { description: Not found, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { description: Error, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified bearer JWT. The actor's role is taken from the token claims.
  schemas:
    LessonView:
      type: object
      properties:
        lesson_id: { type: string }
        title: { type: object, additionalProperties: { type: string } }
        grade: { type: string }
        subject: { type: string }
        curriculum_pack: { type: string }
        instructional_locales: { type: array, items: { type: string } }
        state: { type: string, enum: [draft, in_review, subject_expert, educational_qa, accessibility, language, ai_safety, approved, published, archived] }
        version: { type: integer }
        learning_outcomes: { type: array, items: { type: string } }
        gates:
          type: array
          items:
            type: object
            properties:
              gate: { type: string }
              passed: { type: boolean }
              mode: { type: string, enum: [auto, human] }
              reviewer_role: { type: string }
              reviewer_subject: { type: string, description: Pseudonymous staff id of the certifying reviewer }
              at: { type: number }
        title_audio: { type: object, additionalProperties: { type: string } }
        metadata:
          type: object
          description: Domain metadata (tags, author_role, author_subject, languages, ...).
          additionalProperties: true
          properties:
            tags: { type: array, items: { type: string } }
            author_role: { type: string }
            author_subject: { type: string, description: Pseudonymous staff id of the author }
        provenance: { type: object, additionalProperties: true }
        student_explanation: { $ref: "#/components/schemas/LocalizedTextView" }
        teacher_script: { $ref: "#/components/schemas/LocalizedTextView" }
        worked_examples: { type: array, items: { type: object, additionalProperties: true } }
        practice_questions: { type: array, items: { type: object, additionalProperties: true } }
        homework: { type: array, items: { type: object, additionalProperties: true } }
        assessment: { type: object, additionalProperties: true }
        workflow:
          type: object
          properties:
            state: { type: string }
            history:
              type: array
              items:
                type: object
                properties:
                  from_state: { type: string }
                  to_state: { type: string }
                  action: { type: string }
                  actor_role: { type: string }
                  actor_subject: { type: string, description: Pseudonymous staff id of the actor }
                  at: { type: number }
                  note: { type: string }
        etag: { type: string }
        answer_keys_included:
          type: boolean
          description: True only on a single-lesson read by a reviewer or architect role.
      additionalProperties: true
    LocalizedTextView:
      type: object
      properties:
        text: { type: object, additionalProperties: { type: string } }
        audio_ref: { type: object, additionalProperties: { type: string } }
    VersionView:
      type: object
      properties:
        version: { type: integer }
        content_hash: { type: string }
        change_summary: { type: string }
        author_role: { type: string }
        created_at: { type: number }
    LessonPatchIn:
      type: object
      additionalProperties: false
      properties:
        title: { $ref: "#/components/schemas/LocalizedTitle" }
        title_ur: { type: string, deprecated: true }
        title_en: { type: string, deprecated: true }
        description: { $ref: "#/components/schemas/LocalizedTitle" }
        teacher_script: { $ref: "#/components/schemas/LocalizedTitle" }
        student_explanation: { $ref: "#/components/schemas/LocalizedTitle" }
        revision_notes: { $ref: "#/components/schemas/LocalizedTitle" }
        summary: { $ref: "#/components/schemas/LocalizedTitle" }
        parent_notes: { $ref: "#/components/schemas/LocalizedTitle" }
        mentor_notes: { $ref: "#/components/schemas/LocalizedTitle" }
        accessibility_notes: { $ref: "#/components/schemas/LocalizedTitle" }
        grade: { type: string }
        subject: { type: string }
        curriculum_pack: { type: string }
        instructional_locales: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string } }
        learning_outcomes: { type: array, items: { type: string } }
        prerequisites: { type: array, items: { type: string } }
        keywords: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        chapter_key:
          type: string
          maxLength: 128
          description: >-
            Chapter in the pack's stored hierarchy for the lesson's grade/subject; "" clears the
            placement. An unknown chapter/topic is a 422 BAD_PLACEMENT.
        topic_key: { type: string, maxLength: 128, description: Topic within chapter_key }
        estimated_duration_min: { type: integer, minimum: 1, maximum: 600 }
        difficulty: { type: string, enum: [intro, developing, secure, challenge] }
        offline_package: { type: string }
    Hierarchy:
      type: object
      properties:
        system: { type: string, description: Curriculum pack id }
        version: { type: string, description: Curriculum pack version }
        source: { type: string, enum: [persisted, pack] }
        grades: { type: array, items: { type: string } }
        subjects_by_grade: { type: object, additionalProperties: { type: array, items: { type: string } } }
        tree: { type: array, items: { $ref: "#/components/schemas/HierarchyGrade" } }
    LocalizedTitle:
      type: object
      description: Title text keyed by locale tag.
      additionalProperties: { type: string }
    HierarchyGrade:
      type: object
      properties:
        key: { type: string }
        subjects:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              title: { $ref: "#/components/schemas/LocalizedTitle" }
              chapters:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    title: { $ref: "#/components/schemas/LocalizedTitle" }
                    topics:
                      type: array
                      items:
                        type: object
                        properties:
                          key: { type: string }
                          title: { $ref: "#/components/schemas/LocalizedTitle" }
    CurriculumPackSummary:
      type: object
      properties:
        pack_id: { type: string }
        version: { type: string }
        country: { type: string, description: ISO 3166-1 alpha-2 }
        education_system: { type: string }
        language_of_instruction: { type: string }
        instructional_locales: { type: array, items: { type: string } }
        locales:
          type: array
          items:
            type: object
            properties:
              tag: { type: string }
              name: { type: string }
              direction: { type: string, enum: [ltr, rtl] }
    CurriculumPackList:
      type: object
      properties:
        packs: { type: array, items: { $ref: "#/components/schemas/CurriculumPackSummary" } }
    ProvenanceIn:
      type: object
      properties:
        derivation: { type: string, enum: [authored-original, ingested], default: authored-original }
        source: { type: string, default: authored }
        license: { type: string, default: authored-original }
        aligned_slo_codes: { type: array, items: { type: string } }
        permission_ref: { type: ["string", "null"] }
    AITeachingIn:
      type: object
      properties:
        learning_goals: { type: array, items: { type: string } }
        teaching_strategy: { type: string }
        questioning_strategy: { type: string }
        hint_policy: { type: string }
        escalation_rules: { type: array, items: { type: string } }
        forbidden_behaviours: { type: array, items: { type: string } }
        misconception_detectors: { type: array, items: { type: string } }
    LessonDraftIn:
      type: object
      required: [lesson_id, grade, subject]
      description: >-
        A title is required in at least one locale. Every `title` key must be a locale of the
        lesson's curriculum pack (otherwise 422 BAD_LOCALE). `title_ur` / `title_en` are
        compatibility aliases for `title.ur` / `title.en`; a conflicting value is a 422.
      properties:
        lesson_id: { type: string, maxLength: 128 }
        title: { $ref: "#/components/schemas/LocalizedTitle" }
        title_ur: { type: string, minLength: 1, deprecated: true, description: Alias of title.ur }
        title_en: { type: string, minLength: 1, deprecated: true, description: Alias of title.en }
        grade: { type: string }
        subject: { type: string }
        curriculum_pack: { type: string, default: PK-NCP, minLength: 1, maxLength: 64 }
        instructional_locales:
          type: array
          description: BCP-47-style tags; empty = the pack's language of instruction.
          items: { type: string }
        learning_outcomes: { type: array, items: { type: string } }
        provenance: { $ref: "#/components/schemas/ProvenanceIn" }
        ai_teaching: { $ref: "#/components/schemas/AITeachingIn" }
    ActorIn:
      type: object
      description: Actor role is derived from the bearer token, not this body.
      properties:
        note: { type: string }
    ReviewIn:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, request_changes] }
        note: { type: string }
    PublishIn:
      type: object
      properties:
        change_summary: { type: string }
    RollbackIn:
      type: object
      required: [target_version]
      properties:
        target_version: { type: integer }
        note: { type: string }
    ValidationResult:
      type: object
      properties:
        ok: { type: boolean }
        structural:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [blocker, major, minor] }
              message: { type: string }
              field: { type: string }
        gates:
          type: array
          items:
            type: object
            properties:
              gate: { type: string }
              passed: { type: boolean }
              findings: { type: array, items: { type: string } }
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
