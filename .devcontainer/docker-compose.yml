# Codespaces / devcontainer stack for Project Taleem.
# Mirrors the credentials and engine of the repo's root docker-compose.yml so `make test-pg` and the
# Postgres-gated suite behave identically in the cloud and on a laptop. Development only.

services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taleem
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: taleem
    volumes:
      - taleem-devcontainer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taleem"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  taleem-devcontainer-pgdata:
