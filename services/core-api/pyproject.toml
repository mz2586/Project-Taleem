[project]
name = "taleem-core"
version = "0.1.0"
description = "Project Taleem — Core API. Learning intelligence, curriculum studio, offline sync, guardian portal, and operational controls."
requires-python = ">=3.12"
readme = "README.md"
# The code license is an OPEN founding-team decision (see the repository LICENSE). Metadata must not
# assert MIT until it is ratified — this was corrected for RC1 (previously a premature "MIT").
license = { text = "Proprietary — license undecided; see repository LICENSE" }

# NOTE: the DOMAIN + PLATFORM core is pure-stdlib and testable with no third-party installs
# (hexagonal architecture — the domain has no framework imports). The dependencies below are
# needed only for the ASGI *adapter* runtime (serving) + migrations, not for the unit test suite.
# Audited for RC1 (2026-07-31): every entry is imported by src, or is a runtime server/driver/CLI
# (uvicorn serves, psycopg is the PostgreSQL DBAPI driver, alembic runs migrations). Removed six
# never-referenced packages (pydantic-settings, python-json-logger, opentelemetry-api/sdk,
# prometheus-client, pyjwt) — the config, logging, metrics, and JWT layers are pure-stdlib.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taleem_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Enforce the coding standards in docs/07-engineering/41-coding-standards.md
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RET"]
# S101 (assert) allowed in tests only (see per-file below)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# RFC 9457 names its error type "Problem" by convention; we align to the spec rather than the
# generic *Error suffix. Documented, intentional deviation (not a suppression of a real defect).
"src/taleem_core/platform/errors.py" = ["N818"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are the framework's intended call-in-default idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
