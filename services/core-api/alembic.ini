# Alembic configuration for Project Taleem — Core API.
# The database URL is supplied at runtime from the environment (CS_DATABASE_URL), never hard-coded,
# so the same migrations run against CI's throwaway PostgreSQL and any deployed environment.
# Migrations are reversible and verified upgrade->downgrade->upgrade (DATABASE_ARCHITECTURE.md §20).

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# sqlalchemy.url is injected by alembic/env.py from CS_DATABASE_URL.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
