name: Dependency audit

# Known-vulnerability scanning for the shipped dependency closures (master scope Phase H:
# "dependency and container scanning"). Kept out of Code CI on purpose: a newly published advisory
# can turn this red without any code change, and that signal should stand on its own rather than be
# mixed into the build. Findings are never suppressed here; a red run means "upgrade".
#
# - pip-audit checks services/core-api/requirements.lock, the exact runtime closure the container
#   and the Vercel function install.
# - npm audit checks apps/web production dependencies at severity high and above.

on:
  push:
    branches: [main]
    paths:
      - "services/core-api/requirements.lock"
      - "services/core-api/pyproject.toml"
      - "requirements.txt"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "services/core-api/requirements.lock"
      - "services/core-api/pyproject.toml"
      - "requirements.txt"
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday 05:23 UTC: advisories land without code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (core-api lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.10.1"
      - name: Audit the runtime lock
        run: pip-audit --strict --desc on -r services/core-api/requirements.lock

  npm-audit:
    name: npm audit (web, production deps, high+)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # npm audit reads package-lock.json; no install is needed.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
