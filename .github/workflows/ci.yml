name: Code CI

# Core-API pipeline (docs/37-cicd-pipeline.md). Runs alongside the docs CI.
# The full test suite requires the runtime deps (SQLAlchemy/FastAPI); the previous "zero-install
# stdlib" job was removed after the persistence adapters introduced third-party imports (CTO B2).

on:
  push:
    branches: [main]
    paths: ["services/**", "apps/**", "packages/**", "scripts/**", "infra/monitoring/**", "Makefile", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["services/**", "apps/**", "packages/**", "scripts/**", "infra/monitoring/**", "Makefile", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  core-quality:
    name: Lint · type · coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Vercel requirements match the lock
        working-directory: ${{ github.workspace }}
        run: |
          # requirements.txt is a generated copy of requirements.lock (Vercel cannot use `-r`).
          diff <(tail -n +6 requirements.txt) services/core-api/requirements.lock \
            || { echo "requirements.txt has drifted from services/core-api/requirements.lock"; exit 1; }

      - name: Ruff (lint)
        run: ruff check src tests
      - name: Black (format check)
        run: black --check src tests
      - name: Mypy (types, strict)
        run: mypy
      - name: Pytest + coverage gate
        run: pytest --cov=taleem_core --cov-report=term-missing --cov-fail-under=85

  postgres-tests:
    name: Postgres migration + integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: taleem
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CS_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/taleem
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # CTO H4: exercise the authoritative production schema — migration reversibility on PostgreSQL.
      - name: Alembic upgrade -> downgrade -> upgrade (reversibility)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      # PostgreSQL-gated tests run only when CS_DATABASE_URL is set: migration reversibility, the FTS
      # trigger, and the ORM<->migration schema-parity guard (CTO H13).
      - name: PostgreSQL-gated tests
        run: pytest -q

  # Phase A completion evidence: the recorded end-to-end journey against a REAL running server
  # (uvicorn over HTTP, PostgreSQL behind it), not the in-process TestClient. The fresh service
  # database has no curriculum, so run 1 must give the honest "nothing to learn" decision; the
  # script then seeds the clearly labelled synthetic fixture lesson and run 2 must complete it.
  # The same populated database then goes through the backup + restore drill (RTO evidence).
  e2e-journey:
    name: E2E journey (uvicorn + PostgreSQL) · backup drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: taleem
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CS_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/taleem
      TALEEM_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/taleem
      E2E_FIRST_EXPECT: empty
      E2E_PORT: "8765"
      # Strict: any GAP step fails CI. Both recorded gaps are closed (guardian portal fdd181f;
      # per-request consent gate c8ab6f3), so a GAP appearing here is a regression.
      E2E_STRICT: "1"
      E2E_OUT_DIR: ${{ github.workspace }}/e2e-evidence
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install core-api (runtime + dev)
        working-directory: services/core-api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Migrates, launches uvicorn in the background, waits for /health, runs both journeys, and
      # always stops the server. Exits non-zero on any FAIL step.
      - name: Recorded end-to-end journey
        run: ./scripts/e2e/run_journey.sh
      # pg_dump must be at least the server's major version (16).
      - name: PostgreSQL client for the drill
        run: |
          if ! pg_dump --version 2>/dev/null | grep -Eq ' (1[6-9]|[2-9][0-9])\.'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          pg_dump --version
      - name: Backup + restore drill (dump, scratch DB, verify)
        run: ./scripts/db_backup_restore_drill.sh | tee "$E2E_OUT_DIR/backup-drill.txt"
      - name: Upload journey transcripts + drill report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: e2e-evidence/
          if-no-files-found: warn

  alert-rules:
    name: Alert rules (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # check rules + check config + unit tests of every alert against synthetic series. promtool
      # is the pinned Prometheus 2.53.2 release, sha256-verified by the script.
      - name: promtool check + test infra/monitoring/alerts.yml
        run: ./infra/monitoring/check_rules.sh

  openapi-lint:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # CTO H5: lint every contract, not just openapi.yaml. Pinned for reproducibility.
      - name: Validate all OpenAPI contracts
        run: npx --yes @redocly/cli@1.25.11 lint packages/contracts/*.yaml

  docker-build:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build core-api image
        run: docker build -t taleem/core-api:ci services/core-api

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install + typecheck + test + build
        run: |
          npm ci || npm install
          npm run typecheck
          npm test
          npm run build
