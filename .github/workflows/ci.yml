name: Code CI

# Core-API pipeline (docs/37-cicd-pipeline.md). Runs alongside the docs CI.
# The full test suite requires the runtime deps (SQLAlchemy/FastAPI); the previous "zero-install
# stdlib" job was removed after the persistence adapters introduced third-party imports (CTO B2).

on:
  push:
    branches: [main]
    paths: ["services/**", "apps/**", "packages/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["services/**", "apps/**", "packages/**"]

permissions:
  contents: read

jobs:
  core-quality:
    name: Lint · type · coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Black (format check)
        run: black --check src tests
      - name: Mypy (types, strict)
        run: mypy
      - name: Pytest + coverage gate
        run: pytest --cov=taleem_core --cov-report=term-missing --cov-fail-under=85

  postgres-tests:
    name: Postgres migration + integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: taleem
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CS_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/taleem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # CTO H4: exercise the authoritative production schema — migration reversibility on PostgreSQL.
      - name: Alembic upgrade -> downgrade -> upgrade (reversibility)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      # PostgreSQL-gated tests run only when CS_DATABASE_URL is set: migration reversibility, the FTS
      # trigger, and the ORM<->migration schema-parity guard (CTO H13).
      - name: PostgreSQL-gated tests
        run: pytest -q

  openapi-lint:
    name: OpenAPI contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CTO H5: lint every contract, not just openapi.yaml. Pinned for reproducibility.
      - name: Validate all OpenAPI contracts
        run: npx --yes @redocly/cli@1.25.11 lint packages/contracts/*.yaml

  docker-build:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build core-api image
        run: docker build -t taleem/core-api:ci services/core-api

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + typecheck + test + build
        run: |
          npm ci || npm install
          npm run typecheck
          npm test
          npm run build
